function renderAll() {
  renderMetrics();
  renderModeControls();
  if (reviewMode === "candidates") renderCandidateGroups();
  else if (reviewMode === "final") renderFinalView();
  else if (reviewMode === "continuous") renderContinuous();
  else if (reviewMode === "stats") renderStatsView();
  else renderRows();
}

function lineById(id) {
  return state.scriptLines.find(line => String(line.id) === String(id));
}

function lineIndexById(id) {
  return state.scriptLines.findIndex(line => String(line.id) === String(id));
}

function nextLineId() {
  return Math.max(0, ...state.scriptLines.map(line => Number(line.id) || 0)) + 1;
}

function renumberLines() {
  state.scriptLines.sort((a, b) => parseNum(a.start) - parseNum(b.start) || parseNum(a.end) - parseNum(b.end));
  state.scriptLines.forEach((line, i) => line.index = i + 1);
}

function caretOffset(el) {
  const selection = window.getSelection();
  if (!selection || selection.rangeCount === 0) return String(el.innerText || "").length;
  const range = selection.getRangeAt(0);
  const before = range.cloneRange();
  before.selectNodeContents(el);
  before.setEnd(range.endContainer, range.endOffset);
  return before.toString().length;
}

function updateActiveRowClass() {
  document.querySelectorAll("[data-line-id]").forEach(row => {
    row.classList.toggle("active", String(row.dataset.lineId) === String(activeLineId));
  });
}

function updateLineRowState(line) {
  if (reviewMode === "continuous" || reviewMode === "stats") return false;
  const row = document.querySelector(`[data-line-id="${CSS.escape(String(line.id))}"]`);
  if (!row) return false;
  row.classList.toggle("deleted", Boolean(line.deleted));
  row.classList.toggle("active", String(line.id) === String(activeLineId));
  applyReviewRowClasses(row, line);
  return true;
}

function scrollActiveIntoView() {
  const row = document.querySelector(`[data-line-id="${CSS.escape(String(activeLineId))}"]`);
  if (row) row.scrollIntoView({ block: "center", behavior: "smooth" });
}

function placeCaretAtEnd(el) {
  const range = document.createRange();
  range.selectNodeContents(el);
  range.collapse(false);
  const selection = window.getSelection();
  selection.removeAllRanges();
  selection.addRange(range);
}

function focusLineText(id) {
  const el = document.querySelector(`[data-line-text="${CSS.escape(String(id))}"]`);
  if (!el) return false;
  el.focus();
  placeCaretAtEnd(el);
  return true;
}

function setActive(id, rerender = true) {
  activeLineId = Number(id);
  if (rerender) {
    renderAll();
  } else {
    updateActiveRowClass();
    renderMetrics();
  }
}

function syncTextFromElement(el) {
  if (!canEdit()) return;
  const line = lineById(el.dataset.lineText);
  if (!line) return;
  line.text = String(el.textContent ?? el.innerText ?? "")
    .replace(/\u00a0/g, " ")
    .replace(/[\r\n\t]+/g, " ");
  setActive(line.id, false);
  setDirty();
  renderMetrics();
}

function lineTextValue(line) {
  return cleanReviewText(line?.text || "");
}

function partTime(line, offset, textLength) {
  const start = parseNum(line.start);
  const end = Math.max(start + 0.05, parseNum(line.end));
  const length = Math.max(1, textLength);
  return start + (end - start) * Math.max(0, Math.min(length, offset)) / length;
}

function setLineDeleted(line, reason = "manual-delete") {
  line.deleted = true;
  if (!lineTextValue(line)) line.text = "手动删除";
  if (!String(line.source || "").includes(reason)) {
    line.source = `${line.source || ""} ${reason}`.trim();
  }
}

function isSuggestedDeleteLine(line) {
  const source = String(line.source || "");
  return source.startsWith("delete#")
    || source.includes("suggested-delete")
    || source.includes("delete-csv")
    || source.includes("semantic-llm:delete")
    || source.includes("targeted-fix:delete")
    || line.lineType === "pause";
}

function splitLine(id, pos = null) {
  if (!requireEdit()) return;
  const line = lineById(id);
  if (!line) return;
  pushUndoSnapshot("split-line");
  const text = lineTextValue(line);
  const cut = Math.max(0, Math.min(text.length, pos ?? Math.ceil(text.length / 2)));
  const left = text.slice(0, cut).trim();
  const right = text.slice(cut).trim();
  const start = parseNum(line.start);
  const end = Math.max(start + 0.05, parseNum(line.end));
  const ratio = text.length ? cut / text.length : 1;
  const mid = Math.max(start + 0.05, Math.min(end, start + (end - start) * ratio));
  line.text = left;
  line.end = mid;
  const newLine = {
    ...line,
    id: nextLineId(),
    index: line.index + 1,
    start: mid,
    end: Math.max(mid + 0.05, end),
    text: right,
    deleted: Boolean(line.deleted),
    source: line.source || "",
  };
  const idx = lineIndexById(id);
  state.scriptLines.splice(idx + 1, 0, newLine);
  renumberLines();
  setDirty();
  setActive(newLine.id);
}

function mergeWithPrevious(id) {
  if (!requireEdit()) return;
  const idx = lineIndexById(id);
  if (idx <= 0) return;
  pushUndoSnapshot("merge-previous");
  const prev = state.scriptLines[idx - 1];
  const line = state.scriptLines[idx];
  prev.text = `${prev.text}${line.text ? " " + line.text : ""}`.trim();
  prev.end = Math.max(parseNum(prev.end), parseNum(line.end));
  prev.deleted = Boolean(prev.deleted || line.deleted);
  state.scriptLines.splice(idx, 1);
  renumberLines();
  setDirty();
  setActive(prev.id);
}

function mergeNext(id) {
  if (!requireEdit()) return;
  const idx = lineIndexById(id);
  if (idx < 0 || idx >= state.scriptLines.length - 1) return;
  pushUndoSnapshot("merge-next");
  const line = state.scriptLines[idx];
  const next = state.scriptLines[idx + 1];
  line.text = `${line.text}${next.text ? " " + next.text : ""}`.trim();
  line.end = Math.max(parseNum(line.end), parseNum(next.end));
  line.deleted = Boolean(line.deleted || next.deleted);
  state.scriptLines.splice(idx + 1, 1);
  renumberLines();
  setDirty();
  setActive(line.id);
}

function insertAfter(id) {
  if (!requireEdit()) return;
  const idx = lineIndexById(id);
  if (idx < 0) return;
  pushUndoSnapshot("insert-line");
  const line = state.scriptLines[idx];
  const t = parseNum(line.end);
  const newLine = {
    id: nextLineId(),
    index: line.index + 1,
    start: t,
    end: t + 0.05,
    text: "",
    deleted: false,
    source: "manual",
  };
  state.scriptLines.splice(idx + 1, 0, newLine);
  renumberLines();
  setDirty();
  setActive(newLine.id);
}

function toggleDelete(id) {
  if (!requireEdit()) return;
  const line = lineById(id);
  if (!line) return;
  pushUndoSnapshot("toggle-delete");
  line.deleted = !line.deleted;
  if (line.deleted && !lineTextValue(line)) setLineDeleted(line);
  activeLineId = Number(line.id);
  setDirty();
  if (showDeletedOnly) {
    renderAll();
  } else if (!updateLineRowState(line)) {
    renderAll();
  }
  updateActiveRowClass();
  renderMetrics();
}

function removeLine(id, confirmDelete = true) {
  if (!requireEdit()) return;
  const idx = lineIndexById(id);
  if (idx < 0) return;
  const line = state.scriptLines[idx];
  if (confirmDelete && !confirm(`确定把第 ${line.index} 行标记为删除线？导出的 XML 会剪掉这一段。`)) return;
  pushUndoSnapshot("remove-line");
  setLineDeleted(line);
  activeLineId = line.id;
  setDirty();
  renderAll();
}

function selectionOffsetsInElement(el) {
  const selection = window.getSelection();
  if (!selection || selection.rangeCount === 0 || selection.isCollapsed) return null;
  const range = selection.getRangeAt(0);
  if (!el.contains(range.startContainer) || !el.contains(range.endContainer)) return null;
  const startRange = range.cloneRange();
  startRange.selectNodeContents(el);
  startRange.setEnd(range.startContainer, range.startOffset);
  const endRange = range.cloneRange();
  endRange.selectNodeContents(el);
  endRange.setEnd(range.endContainer, range.endOffset);
  const start = startRange.toString().length;
  const end = endRange.toString().length;
  return {
    start: Math.max(0, Math.min(start, end)),
    end: Math.max(start, end),
  };
}

function splitSelectionAsDeleted(textEl) {
  if (!requireEdit()) return false;
  const line = lineById(textEl.dataset.lineText);
  if (!line) return false;
  const offsets = selectionOffsetsInElement(textEl);
  const text = lineTextValue(line);
  if (!offsets || offsets.end <= offsets.start || !text) return false;
  const startOffset = Math.max(0, Math.min(text.length, offsets.start));
  const endOffset = Math.max(startOffset, Math.min(text.length, offsets.end));
  if (endOffset <= startOffset) return false;

  const idx = lineIndexById(line.id);
  pushUndoSnapshot("selection-delete");
  let nextIdValue = nextLineId();
  const originalEnd = Math.max(partTime(line, 0, text.length) + 0.01, parseNum(line.end));
  const parts = [
    { text: text.slice(0, startOffset), startOffset: 0, endOffset: startOffset, deleted: false, source: line.source || "" },
    { text: text.slice(startOffset, endOffset), startOffset, endOffset, deleted: true, source: `${line.source || ""} manual-selection-delete`.trim() },
    { text: text.slice(endOffset), startOffset: endOffset, endOffset: text.length, deleted: false, source: line.source || "" },
  ];
  const replacement = [];
  for (const part of parts) {
    const partText = cleanReviewText(part.text);
    if (!part.deleted && !partText) continue;
    const partStart = partTime(line, part.startOffset, text.length);
    const partEnd = Math.min(originalEnd, Math.max(partStart, partTime(line, part.endOffset, text.length)));
    if (partEnd <= partStart + 0.001) continue;
    replacement.push({
      ...line,
      id: replacement.length === 0 ? line.id : nextIdValue++,
      index: line.index + replacement.length,
      start: Number(partStart.toFixed(3)),
      end: Number(partEnd.toFixed(3)),
      text: partText || "手动删除",
      deleted: part.deleted,
      source: part.source,
    });
  }
  if (!replacement.length) return false;
  state.scriptLines.splice(idx, 1, ...replacement);
  renumberLines();
  setDirty();
  setActive(replacement.find(item => item.deleted)?.id || replacement[0].id);
  scrollActiveIntoView();
  return true;
}

function moveActive(delta, focusText = false) {
  const rows = visibleLines();
  if (!rows.length) return;
  const current = rows.findIndex(line => String(line.id) === String(activeLineId));
  const next = current < 0
    ? (delta > 0 ? 0 : rows.length - 1)
    : Math.max(0, Math.min(rows.length - 1, current + delta));
  setActive(rows[next].id);
  scrollActiveIntoView();
  if (focusText) requestAnimationFrame(() => focusLineText(rows[next].id));
}

function jumpDeleted(delta) {
  const deleted = state.scriptLines.filter(line => line.deleted);
  if (!deleted.length) {
    setStatus("当前没有删除线", "danger-text");
    return;
  }
  const active = lineById(activeLineId);
  const activeIndex = active ? active.index : (delta > 0 ? 0 : Number.MAX_SAFE_INTEGER);
  let next = delta > 0
    ? deleted.find(line => line.index > activeIndex) || deleted[0]
    : [...deleted].reverse().find(line => line.index < activeIndex) || deleted[deleted.length - 1];
  setActive(next.id);
  scrollActiveIntoView();
}

function isReviewJumpTarget(line) {
  return reviewItemFlags(line).length > 0 || isSuggestedDeleteLine(line);
}

function jumpReview(delta) {
  const targets = state.scriptLines.filter(isReviewJumpTarget);
  if (!targets.length) {
    setStatus("当前没有待审或高风险片段", "danger-text");
    return;
  }
  const active = lineById(activeLineId);
  const activeIndex = active ? active.index : (delta > 0 ? 0 : Number.MAX_SAFE_INTEGER);
  const next = delta > 0
    ? targets.find(line => line.index > activeIndex) || targets[0]
    : [...targets].reverse().find(line => line.index < activeIndex) || targets[targets.length - 1];
  selectedDeleteInterval = null;
  setActive(next.id);
  scrollActiveIntoView();
  seekToLine(next);
}

function linesForTakeId(takeId) {
  return state.scriptLines.filter(line => String(line.takeId || "") === String(takeId));
}

function referenceIndexForTake(takeId) {
  const line = linesForTakeId(takeId)[0];
  return line?.referenceIndex;
}

function keepTake(takeId) {
  if (!requireEdit()) return;
  const refIndex = referenceIndexForTake(takeId);
  if (refIndex === undefined || refIndex === null) return;
  pushUndoSnapshot("keep-take");
  state.scriptLines.forEach(line => {
    if (line.referenceIndex !== refIndex || line.lineType === "pause") return;
    const keep = String(line.takeId || "") === String(takeId);
    line.deleted = !keep;
    line.takeRole = keep ? "primary" : "alternate";
  });
  setDirty();
  setStatus("已保留该候选 take", "ok");
  renderAll();
}

function toggleTakeDelete(takeId) {
  if (!requireEdit()) return;
  const lines = linesForTakeId(takeId);
  if (!lines.length) return;
  pushUndoSnapshot("toggle-take-delete");
  const shouldDelete = !lines.every(line => line.deleted);
  lines.forEach(line => {
    line.deleted = shouldDelete;
    line.takeRole = shouldDelete && line.takeRole === "primary" ? "alternate" : line.takeRole;
  });
  activeLineId = lines[0].id;
  setDirty();
  setStatus(shouldDelete ? "已标记该候选 take 为删除" : "已恢复该候选 take", "ok");
  renderAll();
}

function deletedIntervals() {
  const intervals = state.scriptLines
    .filter(line => line.deleted)
    .map(line => ({
      start: parseNum(line.start),
      end: Math.max(parseNum(line.start), parseNum(line.end)),
    }))
    .filter(item => item.end > item.start + 0.02)
    .sort((a, b) => a.start - b.start || a.end - b.end);
  const merged = [];
  for (const item of intervals) {
    const last = merged[merged.length - 1];
    if (last && item.start <= last.end + 0.02) {
      last.end = Math.max(last.end, item.end);
    } else {
      merged.push({ ...item });
    }
  }
  return merged;
}

function nextKeptTime(value) {
  let time = Math.max(0, Number(value) || 0);
  for (const item of deletedIntervals()) {
    if (time >= item.start - 0.01 && time < item.end - 0.01) {
      time = item.end + 0.01;
    }
  }
  return time;
}

function sourceToOutputTime(value) {
  let removed = 0;
  const time = Math.max(0, Number(value) || 0);
  for (const item of deletedIntervals()) {
    if (time >= item.end) {
      removed += item.end - item.start;
    } else if (time > item.start) {
      removed += time - item.start;
      break;
    } else {
      break;
    }
  }
  return Math.max(0, time - removed);
}

function timelineViewDuration() {
  return Math.max(0.1, projectDuration() / Math.max(1, Number(timelineZoom) || 1));
}

function timelineViewEnd() {
  return Math.min(projectDuration(), timelineViewStart + timelineViewDuration());
}

function maxTimelineViewStart() {
  return Math.max(0, projectDuration() - timelineViewDuration());
}

function clampTimelineViewStart(value) {
  return Math.max(0, Math.min(maxTimelineViewStart(), Number(value) || 0));
}

function normalizeTimelineView() {
  timelineZoom = Math.max(1, Math.min(16, Number(timelineZoom) || 1));
  timelineViewStart = timelineZoom <= 1 ? 0 : clampTimelineViewStart(timelineViewStart);
}

function centerTimelineView(time) {
  normalizeTimelineView();
  if (timelineZoom <= 1) return;
  timelineViewStart = clampTimelineViewStart((Number(time) || 0) - timelineViewDuration() / 2);
}

function ensureTimelineTimeVisible(time) {
  normalizeTimelineView();
  if (timelineZoom <= 1) return;
  const value = Number(time) || 0;
  const start = timelineViewStart;
  const end = timelineViewEnd();
  if (value < start || value > end) centerTimelineView(value);
}

function percentForTime(value) {
  normalizeTimelineView();
  const duration = timelineViewDuration();
  return Math.max(0, Math.min(100, ((Number(value) || 0) - timelineViewStart) / duration * 100));
}

function visibleIntervalPercent(start, end) {
  normalizeTimelineView();
  const clippedStart = Math.max(Number(start) || 0, timelineViewStart);
  const clippedEnd = Math.min(Number(end) || 0, timelineViewEnd());
  if (clippedEnd <= clippedStart) return null;
  const left = percentForTime(clippedStart);
  return {
    left,
    width: Math.max(0.25, percentForTime(clippedEnd) - left),
  };
}

function lineAtTime(time) {
  const value = Number(time) || 0;
  return state.scriptLines.find(line => value >= parseNum(line.start) && value <= parseNum(line.end))
    || [...state.scriptLines].sort((a, b) => Math.abs(parseNum(a.start) - value) - Math.abs(parseNum(b.start) - value))[0]
    || null;
}

function activeLineRange() {
  const line = lineById(activeLineId);
  if (!line) return null;
  return {
    start: parseNum(line.start),
    end: Math.max(parseNum(line.start) + 0.05, parseNum(line.end)),
  };
}

function deletionIntervalAt(time) {
  const value = Number(time) || 0;
  return deletedIntervals().find(item => value >= item.start && value <= item.end) || null;
}

function deletedLinesForInterval(interval) {
  if (!interval) return [];
  return state.scriptLines.filter(line => {
    if (!line.deleted) return false;
    const start = parseNum(line.start);
    const end = Math.max(start, parseNum(line.end));
    return end > interval.start + 0.01 && start < interval.end - 0.01;
  });
}

function timelineOverlayHtml({ withHandles = false } = {}) {
  const intervalKey = selectedDeleteInterval ? `${selectedDeleteInterval.start.toFixed(3)}-${selectedDeleteInterval.end.toFixed(3)}` : "";
  const deletes = deletedIntervals().map(item => {
    const visible = visibleIntervalPercent(item.start, item.end);
    if (!visible) return "";
    const key = `${item.start.toFixed(3)}-${item.end.toFixed(3)}`;
    const inspect = key === intervalKey ? " inspect" : "";
    return `<span class="timeline-delete-block${inspect}" data-delete-start="${item.start}" data-delete-end="${item.end}" style="left:${visible.left}%;width:${visible.width}%"></span>`;
  }).join("");
  const risks = state.scriptLines.filter(line => reviewItemFlags(line).length).map(line => {
    const start = parseNum(line.start);
    if (start < timelineViewStart || start > timelineViewEnd()) return "";
    const left = percentForTime(start);
    return `<span class="timeline-risk-mark" style="left:${left}%"></span>`;
  }).join("");
  const range = selectedDeleteInterval || activeLineRange();
  const selection = range ? (() => {
    const visible = visibleIntervalPercent(range.start, range.end);
    if (!visible) return "";
    const left = percentForTime(Math.max(range.start, timelineViewStart));
    const right = percentForTime(Math.min(range.end, timelineViewEnd()));
    const handles = withHandles ? `<span class="range-handle start" style="left:${left}%"></span><span class="range-handle end" style="left:${right}%"></span>` : "";
    return `<span class="timeline-selection" style="left:${visible.left}%;width:${Math.max(0.3, visible.width)}%"></span>${handles}`;
  })() : "";
  const playhead = `<span class="timeline-playhead" style="left:${percentForTime(timelineSourceTime)}%"></span>`;
  return `${deletes}${risks}${selection}${playhead}`;
}

function waveformBarsHtml() {
  if (waveformLoading) return `<div class="waveform-status">正在生成真实波形…</div>`;
  if (waveformError) return `<div class="waveform-status">${escapeHtml(waveformError)}</div>`;
  if (!waveformPeaks.length) return `<div class="waveform-status">展开后生成真实波形</div>`;
  normalizeTimelineView();
  const duration = Math.max(0.1, projectDuration());
  const first = Math.max(0, Math.floor(timelineViewStart / duration * waveformPeaks.length));
  const last = Math.min(waveformPeaks.length, Math.ceil(timelineViewEnd() / duration * waveformPeaks.length));
  const visiblePeaks = waveformPeaks.slice(first, Math.max(first + 2, last));
  const count = visiblePeaks.length;
  const rangePath = visiblePeaks.map((bucket, i) => {
    const x = count <= 1 ? 0 : (i / (count - 1)) * 100;
    const top = 50 - Math.max(1.5, bucket.max * 43);
    const bottom = 50 - Math.min(-1.5, bucket.min * 43);
    return `M ${x.toFixed(3)} ${top.toFixed(3)} L ${x.toFixed(3)} ${bottom.toFixed(3)}`;
  }).join(" ");
  const tracePath = visiblePeaks.map((bucket, i) => {
    const x = count <= 1 ? 0 : (i / (count - 1)) * 100;
    const y = 50 - bucket.trace * 39;
    return `${i === 0 ? "M" : "L"} ${x.toFixed(3)} ${y.toFixed(3)}`;
  }).join(" ");
  return `<svg class="waveform-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-label="真实音频波形">
    <path class="waveform-midline" d="M 0 50 L 100 50"></path>
    <path class="waveform-range" d="${rangePath}"></path>
    <path class="waveform-trace" d="${tracePath}"></path>
  </svg>`;
}

function waveformBarCount() {
  const width = $("waveform")?.clientWidth || 900;
  return Math.max(240, Math.min(2400, Math.round(width / 2 * Math.max(1, timelineZoom))));
}

function waveformSourceMedia() {
  return document.querySelector("[data-source-media]") || document.querySelector("[data-edited-media]");
}

function waveformMediaUrl(media) {
  if (!media) return "";
  return media.currentSrc || media.getAttribute("src") || "";
}

function resetWaveform() {
  waveformPeaks = [];
  waveformSignature = "";
  waveformLoading = false;
  waveformError = "";
}

function normalizeWaveformPeaks(peaks) {
  return (peaks || []).map(bucket => ({
    min: Math.max(-1, Math.min(1, Number(bucket.min) || 0)),
    max: Math.max(-1, Math.min(1, Number(bucket.max) || 0)),
    trace: Math.max(-1, Math.min(1, Number(bucket.trace) || 0)),
  }));
}

async function fetchServerWaveformPeaks(count) {
  if (!currentProjectId) return [];
  const res = await fetch(`${apiPath("/api/waveform")}&bins=${encodeURIComponent(count)}`, { cache: "force-cache" });
  if (!res.ok) return [];
  const data = await res.json();
  if (!data.ok || !Array.isArray(data.peaks)) return [];
  return normalizeWaveformPeaks(data.peaks);
}

async function ensureWaveformPeaks() {
  if (!timelineExpanded || waveformLoading) return;
  const media = waveformSourceMedia();
  const url = waveformMediaUrl(media);
  const count = waveformBarCount();
  const signature = `${url}|${count}`;
  if (!url) {
    waveformPeaks = [];
    waveformSignature = signature;
    waveformError = "没有可用音频";
    renderTimeline();
    return;
  }
  if (signature === waveformSignature && (waveformPeaks.length || waveformError)) return;
  waveformSignature = signature;
  waveformPeaks = [];
  waveformError = "";
  waveformLoading = true;
  renderTimeline();
  try {
    let serverPeaks = [];
    try {
      serverPeaks = await fetchServerWaveformPeaks(count);
    } catch {
      serverPeaks = [];
    }
    if (serverPeaks.length) {
      waveformPeaks = serverPeaks;
      return;
    }
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) throw new Error("浏览器不支持音频解码");
    const response = await fetch(url, { cache: "force-cache" });
    if (!response.ok) throw new Error(`读取音频失败 ${response.status}`);
    const arrayBuffer = await response.arrayBuffer();
    const context = new AudioContextClass();
    const audioBuffer = await context.decodeAudioData(arrayBuffer);
    const channelCount = Math.max(1, audioBuffer.numberOfChannels);
    const samplesPerBar = Math.max(1, Math.floor(audioBuffer.length / count));
    const buckets = [];
    let maxAbs = 0;
    for (let i = 0; i < count; i += 1) {
      const start = i * samplesPerBar;
      const end = Math.min(audioBuffer.length, start + samplesPerBar);
      let min = 1;
      let max = -1;
      let trace = 0;
      let traceCount = 0;
      const traceStart = Math.max(start, Math.floor((start + end) / 2) - 2);
      const traceEnd = Math.min(end, traceStart + 5);
      for (let j = start; j < end; j += 1) {
        let sample = 0;
        for (let c = 0; c < channelCount; c += 1) sample += audioBuffer.getChannelData(c)[j] || 0;
        sample /= channelCount;
        min = Math.min(min, sample);
        max = Math.max(max, sample);
        maxAbs = Math.max(maxAbs, Math.abs(sample));
        if (j >= traceStart && j < traceEnd) {
          trace += sample;
          traceCount += 1;
        }
      }
      buckets.push({ min, max, trace: trace / Math.max(1, traceCount) });
    }
    const scale = Math.max(maxAbs, 0.0001);
    waveformPeaks = buckets.map(bucket => ({
      min: Math.max(-1, Math.min(1, bucket.min / scale)),
      max: Math.max(-1, Math.min(1, bucket.max / scale)),
      trace: Math.max(-1, Math.min(1, bucket.trace / scale)),
    }));
    if (context.close) await context.close();
  } catch {
    waveformPeaks = [];
    waveformError = "真实波形不可用";
  } finally {
    waveformLoading = false;
    renderTimeline();
  }
}

function timelineLabelsHtml() {
  normalizeTimelineView();
  const start = timelineViewStart;
  const span = timelineViewDuration();
  return [0, 0.2, 0.4, 0.6, 0.8, 1]
    .map(ratio => `<span>${fmt(start + span * ratio)}</span>`)
    .join("");
}

function scheduleTimelineRender() {
  if (timelineRenderFrame) return;
  timelineRenderFrame = requestAnimationFrame(() => {
    timelineRenderFrame = null;
    renderTimeline();
  });
}

function syncTimelineFromMedia(media, { skipDeleted = false } = {}) {
  if (!media) return;
  if (skipDeleted) applyEditedSkip(media);
  timelineSourceTime = Number(media.currentTime) || 0;
  ensureTimelineTimeVisible(timelineSourceTime);
  scheduleTimelineRender();
}

function renderTimeline() {
  const track = $("timelineTrack");
  if (!track) return;
  normalizeTimelineView();
  document.body.classList.toggle("timeline-expanded", timelineExpanded);
  $("timelineExpandBtn").textContent = timelineExpanded ? "收起 ⌘B" : "展开 ⌘B";
  const labels = timelineLabelsHtml();
  $("timelineLabels").innerHTML = labels;
  const expandedLabels = $("expandedTimelineLabels");
  if (expandedLabels) expandedLabels.innerHTML = labels;
  track.innerHTML = timelineOverlayHtml();
  $("timelineOutputTime").textContent = fmt(sourceToOutputTime(timelineSourceTime));
  $("timelineSourceTime").textContent = fmt(timelineSourceTime);
  const zoomInput = $("timelineZoom");
  if (zoomInput && Number(zoomInput.value) !== Number(timelineZoom)) zoomInput.value = String(timelineZoom);
  const panInput = $("timelinePan");
  if (panInput) {
    const maxStart = maxTimelineViewStart();
    panInput.value = maxStart > 0 ? String(timelineViewStart / maxStart) : "0";
    panInput.disabled = timelineZoom <= 1;
  }
  const viewLabel = $("timelineViewLabel");
  if (viewLabel) {
    viewLabel.textContent = timelineZoom <= 1
      ? "全片"
      : `${fmt(timelineViewStart)}-${fmt(timelineViewEnd())}`;
  }
  const waveform = $("waveform");
  if (waveform) waveform.innerHTML = `${waveformBarsHtml()}${timelineOverlayHtml({ withHandles: true })}`;
  if (timelineExpanded) ensureWaveformPeaks();
  const actions = $("inspectActions");
  const lines = deletedLinesForInterval(selectedDeleteInterval);
  actions.classList.toggle("active", Boolean(selectedDeleteInterval));
  if (selectedDeleteInterval) {
    $("inspectLabel").textContent = `选中删除段：源 ${fmt(selectedDeleteInterval.start)}-${fmt(selectedDeleteInterval.end)} · ${lines.length} 行`;
  }
}

function seekMediaTo(time, target = "source") {
  const selector = target === "edited" ? "[data-edited-media]" : "[data-source-media]";
  const media = document.querySelector(selector);
  if (!media) return;
  media.currentTime = Math.max(0, Number(time) || 0);
}

function seekToLine(line) {
  if (!line) return;
  timelineSourceTime = parseNum(line.start);
  ensureTimelineTimeVisible(timelineSourceTime);
  seekMediaTo(timelineSourceTime, "source");
  renderTimeline();
}

function selectTimelineTime(time, fromDeletedBlock = false) {
  const deleted = deletionIntervalAt(time);
  if (deleted && fromDeletedBlock) {
    selectedDeleteInterval = { ...deleted };
    timelineExpanded = true;
    const firstLine = deletedLinesForInterval(selectedDeleteInterval)[0];
    if (firstLine) {
      activeLineId = Number(firstLine.id);
      timelineSourceTime = parseNum(firstLine.start);
      renderAll();
      scrollActiveIntoView();
      seekMediaTo(timelineSourceTime, "source");
      setStatus("已进入删除段检查：可试听、恢复或微调边界。", "ok");
      return;
    }
  }
  selectedDeleteInterval = null;
  const line = lineAtTime(time);
  if (line) {
    activeLineId = Number(line.id);
    timelineSourceTime = parseNum(line.start);
    renderAll();
    scrollActiveIntoView();
    seekMediaTo(timelineSourceTime, "source");
  }
}

function timeFromTimelineEvent(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / Math.max(1, rect.width)));
  return timelineViewStart + ratio * timelineViewDuration();
}

function handleTimelineClick(e) {
  const time = timeFromTimelineEvent(e);
  selectTimelineTime(time, Boolean(e.target.closest(".timeline-delete-block")));
}

function toggleTimelineExpanded() {
  timelineExpanded = !timelineExpanded;
  if (timelineExpanded) ensureTimelineTimeVisible(timelineSourceTime);
  renderTimeline();
}

function setTimelineZoom(value) {
  const center = timelineViewStart + timelineViewDuration() / 2;
  timelineZoom = Math.max(1, Math.min(16, Number(value) || 1));
  timelineViewStart = timelineZoom <= 1 ? 0 : clampTimelineViewStart(center - timelineViewDuration() / 2);
  ensureTimelineTimeVisible(timelineSourceTime);
  resetWaveform();
  renderTimeline();
}

function setTimelinePan(value) {
  normalizeTimelineView();
  const maxStart = maxTimelineViewStart();
  timelineViewStart = maxStart > 0 ? clampTimelineViewStart(maxStart * Math.max(0, Math.min(1, Number(value) || 0))) : 0;
  renderTimeline();
}

function toggleTimelinePlayback() {
  const media = document.querySelector("[data-edited-media]");
  if (!media) return;
  if (media.paused) {
    media.currentTime = nextKeptTime(activeLineRange()?.start ?? timelineSourceTime);
    applyEditedSkip(media);
    const playResult = media.play();
    if (playResult?.catch) playResult.catch(() => {});
  } else {
    media.pause();
  }
}

function playSelectedDeleteInterval() {
  if (!selectedDeleteInterval) return;
  playRange(selectedDeleteInterval.start, selectedDeleteInterval.end, "source");
}

function restoreSelectedDeleteInterval() {
  if (!requireEdit() || !selectedDeleteInterval) return;
  const lines = deletedLinesForInterval(selectedDeleteInterval);
  if (!lines.length) return;
  pushUndoSnapshot("restore-delete-interval");
  lines.forEach(line => line.deleted = false);
  selectedDeleteInterval = null;
  setDirty();
  renderAll();
  setStatus("已恢复选中的删除段", "ok");
}

function nudgeSelectedDeleteBoundary(edge, delta) {
  if (!requireEdit() || !selectedDeleteInterval) return;
  const lines = deletedLinesForInterval(selectedDeleteInterval).sort((a, b) => parseNum(a.start) - parseNum(b.start));
  if (!lines.length) return;
  pushUndoSnapshot("nudge-delete-boundary");
  const snap = $("timelineSnap")?.checked;
  const step = snap ? Math.round(delta * 10) / 10 : delta;
  if (edge === "start") {
    const line = lines[0];
    line.start = Number(Math.max(0, Math.min(parseNum(line.end) - 0.05, parseNum(line.start) + step)).toFixed(3));
  } else {
    const line = lines[lines.length - 1];
    line.end = Number(Math.max(parseNum(line.start) + 0.05, parseNum(line.end) + step).toFixed(3));
  }
  selectedDeleteInterval = {
    start: Math.min(...lines.map(line => parseNum(line.start))),
    end: Math.max(...lines.map(line => parseNum(line.end))),
  };
  setDirty();
  renderAll();
}

function applyEditedSkip(media) {
  if (!media) return;
  let current = Number(media.currentTime) || 0;
  const intervals = deletedIntervals();
  for (let guard = 0; guard < intervals.length; guard += 1) {
    const item = intervals.find(candidate => current >= candidate.start && current < candidate.end - 0.02);
    if (!item) break;
    current = item.end + 0.01;
    media.currentTime = current;
  }
}

function clearEditedSkipPreview() {
  const media = editedSkipMedia;
  if (media && editedSkipHandler) {
    media.removeEventListener("timeupdate", editedSkipHandler);
    media.removeEventListener("seeking", editedSkipHandler);
  }
  if (editedSkipPollTimer) clearInterval(editedSkipPollTimer);
  editedSkipHandler = null;
  editedSkipPollTimer = null;
  editedSkipMedia = null;
}

function applyTimelineMediaSettings(media) {
  if (!media) return;
  const speed = parseNum($("timelineSpeed")?.value || 1) || 1;
  const volume = Math.max(0, Math.min(1, parseNum($("timelineVolume")?.value ?? 1)));
  media.playbackRate = speed;
  media.volume = volume;
}

function attachEditedSkipPreview() {
  const media = document.querySelector("[data-edited-media]");
  if (!media) return;
  clearEditedSkipPreview();
  applyTimelineMediaSettings(media);
  editedSkipHandler = () => {
    syncTimelineFromMedia(media, { skipDeleted: true });
  };
  editedSkipMedia = media;
  media.addEventListener("timeupdate", editedSkipHandler);
  media.addEventListener("seeking", editedSkipHandler);
  editedSkipPollTimer = setInterval(() => {
    if (!media.paused) syncTimelineFromMedia(media, { skipDeleted: true });
  }, 20);
  updateEditedPreviewInfo();
}

function updateEditedPreviewInfo() {
  if (!$("editedPreviewInfo")) return;
  const deleted = deletedIntervals().reduce((sum, item) => sum + item.end - item.start, 0);
  $("editedPreviewInfo").textContent = deleted > 0
    ? `跳过 ${fmt(deleted)} 删除段`
    : "无删除段";
}

function clearPlaybackStop() {
  if (stopMedia && stopHandler) stopMedia.removeEventListener("timeupdate", stopHandler);
  if (stopPollTimer) clearInterval(stopPollTimer);
  stopHandler = null;
  stopMedia = null;
  stopPollTimer = null;
}

function stopPlayback(media) {
  media.pause();
  clearPlaybackStop();
}

function playRange(start, end, target = "source") {
  const media = document.querySelector(target === "source" ? "[data-source-media]" : "[data-edited-media]");
  if (!media) return;
  clearPlaybackStop();
  const startAt = Number(start) || 0;
  const endAt = Math.max(startAt + 0.05, Number(end) || startAt + 0.05);
  const preRoll = target === "source" ? 0 : 0.15;
  const postRoll = target === "source" ? 0 : 0.12;
  const stopAt = endAt + postRoll;
  stopHandler = () => {
    syncTimelineFromMedia(media, { skipDeleted: target === "edited" });
    if (media.currentTime >= stopAt) {
      stopPlayback(media);
    }
  };
  media.currentTime = target === "edited"
    ? Math.max(0, nextKeptTime(startAt) - preRoll)
    : Math.max(0, startAt - preRoll);
  stopMedia = media;
  media.addEventListener("timeupdate", stopHandler);
  stopPollTimer = setInterval(stopHandler, target === "source" ? 10 : 30);
  const playResult = media.play();
  if (playResult?.catch) {
    playResult.catch(() => clearPlaybackStop());
  }
}

function handleConflict(data) {
  saveConflict = data;
  setStatus(`保存冲突：磁盘版本已经更新（当前版本 ${shortRevision(data.currentRevision)}）。请重载或强制覆盖。`, "danger-text");
  renderAll();
}

async function saveState(force = false) {
  if (busyMode) return;
  if (!requireEdit()) return;
  state.useScriptLines = true;
  state.updatedAt = new Date().toISOString();
  setBusy("saving");
  setStatus(force ? "正在强制覆盖保存" : "正在保存");
  try {
    const res = await fetch(apiPath("/api/save"), {
      method: "POST",
      body: JSON.stringify({ state, baseRevision, force, lockToken }),
    });
    const data = await res.json();
    if (res.status === 423 || data.locked) {
      applyLockStatus({ locked: true, heldByMe: false, lock: data.lock });
      setStatus(`保存失败：${data.lock?.ownerName || "其他浏览器"} 正在编辑。`, "danger-text");
      return;
    }
    if (res.status === 409 || data.conflict) {
      handleConflict(data);
      return;
    }
    if (data.ok) {
      baseRevision = data.revision || baseRevision;
      dirty = false;
      saveConflict = null;
    }
    renderAll();
    setStatus(data.ok ? `已保存：${data.path}` : `保存失败：${data.error}`, data.ok ? "ok" : "danger-text");
  } catch (err) {
    setStatus(`保存失败：${err.message}`, "danger-text");
  } finally {
    setBusy("");
  }
}

async function exportState(render = false) {
  if (busyMode) return;
  if (!requireEdit()) return;
  state.useScriptLines = true;
  state.updatedAt = new Date().toISOString();
  setBusy(render ? "rendering" : "exporting");
  setStatus(render ? "正在按删除线渲染预览，可能需要一段时间" : "正在导出");
  try {
    const res = await fetch(apiPath(render ? "/api/render" : "/api/export"), {
      method: "POST",
      body: JSON.stringify({ state, baseRevision, lockToken }),
    });
    const data = await res.json();
    if (res.status === 423 || data.locked) {
      applyLockStatus({ locked: true, heldByMe: false, lock: data.lock });
      setStatus(`${render ? "渲染" : "导出"}失败：${data.lock?.ownerName || "其他浏览器"} 正在编辑。`, "danger-text");
      return;
    }
    if (res.status === 409 || data.conflict) {
      handleConflict(data);
      return;
    }
    if (!data.ok) {
      setStatus(`导出失败：${data.error}`, "danger-text");
      return;
    }
    const r = data.result;
    baseRevision = data.revision || baseRevision;
    dirty = false;
    saveConflict = null;
    renderExportResults(r);
    renderAll();
    setStatus(render ? "已导出并渲染预览" : "已导出文件", "ok");
  } catch (err) {
    setStatus(`${render ? "渲染" : "导出"}失败：${err.message}`, "danger-text");
  } finally {
    setBusy("");
  }
}

document.addEventListener("input", (e) => {
  const target = e.target;
  if (target.id === "search") {
    renderAll();
    return;
  }
  if (target.dataset?.lineText) syncTextFromElement(target);
});

document.addEventListener("beforeinput", (e) => {
  const textEl = e.target.closest?.("[data-line-text]");
  if (!textEl || !canEdit()) return;
  beginTextHistory();
});

document.addEventListener("keydown", (e) => {
  const textEl = e.target.closest?.("[data-line-text]");
  const isEditable = Boolean(textEl) || ["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "b") {
    e.preventDefault();
    toggleTimelineExpanded();
    return;
  }
  if ((e.metaKey || e.ctrlKey) && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    e.preventDefault();
    if (textEl) syncTextFromElement(textEl);
    jumpReview(e.key === "ArrowDown" ? 1 : -1);
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z") {
    if (e.target.id === "search") return;
    e.preventDefault();
    if (textEl) syncTextFromElement(textEl);
    if (e.shiftKey) redoEdit();
    else undoEdit();
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "y") {
    if (e.target.id === "search") return;
    e.preventDefault();
    if (textEl) syncTextFromElement(textEl);
    redoEdit();
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") {
    e.preventDefault();
    saveState(false);
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "p") {
    e.preventDefault();
    if (textEl) syncTextFromElement(textEl);
    const line = lineById(textEl?.dataset.lineText || activeLineId);
    if (line) playRange(line.start, line.end, "source");
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "d") {
    e.preventDefault();
    if (textEl && splitSelectionAsDeleted(textEl)) return;
    if (activeLineId) toggleDelete(activeLineId);
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "j") {
    e.preventDefault();
    if (activeLineId) mergeNext(activeLineId);
    return;
  }
  if (!isEditable && e.key === "/") {
    e.preventDefault();
    $("search").focus();
    return;
  }
  if (!isEditable && e.key.toLowerCase() === "j") {
    e.preventDefault();
    moveActive(1);
    return;
  }
  if (!isEditable && e.key.toLowerCase() === "k") {
    e.preventDefault();
    moveActive(-1);
    return;
  }
  if (!e.metaKey && !e.ctrlKey && !e.altKey && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    if (textEl || !isEditable) {
      e.preventDefault();
      if (textEl) syncTextFromElement(textEl);
      moveActive(e.key === "ArrowDown" ? 1 : -1, true);
      return;
    }
  }
  if (e.key === "Escape") {
    if ($("search").value) {
      $("search").value = "";
      renderAll();
    }
    if (document.activeElement?.blur) document.activeElement.blur();
    return;
  }
  if (!textEl) return;
  const id = textEl.dataset.lineText;
  if (e.key === "Tab") {
    e.preventDefault();
    syncTextFromElement(textEl);
    moveActive(e.shiftKey ? -1 : 1, true);
    return;
  }
  if ((e.key === "Backspace" || e.key === "Delete") && !String(lineById(id)?.text || "").trim()) {
    e.preventDefault();
    removeLine(id, false);
    return;
  }
  if (e.key === "Enter") {
    e.preventDefault();
    syncTextFromElement(textEl);
    splitLine(id, caretOffset(textEl));
    return;
  }
  if (e.key === "Backspace" && caretOffset(textEl) === 0) {
    e.preventDefault();
    syncTextFromElement(textEl);
    mergeWithPrevious(id);
  }
});

document.addEventListener("paste", (e) => {
  const textEl = e.target.closest?.("[data-line-text]");
  if (!textEl) return;
  if (!canEdit()) return;
  e.preventDefault();
  beginTextHistory();
  document.execCommand("insertText", false, e.clipboardData.getData("text/plain"));
});

document.addEventListener("click", (e) => {
  const row = e.target.closest?.("[data-line-id]");
  if (row) {
    setActive(row.dataset.lineId, false);
    const line = lineById(row.dataset.lineId);
    selectedDeleteInterval = null;
    seekToLine(line);
  }
  const button = e.target.closest?.("button");
  if (!button) return;
  if (button.dataset.reviewFilter) {
    qaFilter = button.dataset.reviewFilter;
    renderAll();
    return;
  }
  if (button.dataset.toggleTime) {
    expandedTimeLineId = String(expandedTimeLineId) === String(button.dataset.toggleTime) ? null : Number(button.dataset.toggleTime);
    renderAll();
    return;
  }
  if (button.dataset.playLine) {
    const line = lineById(button.dataset.playLine);
    if (line) playRange(line.start, line.end, "source");
  }
  if (button.dataset.toggleDelete) toggleDelete(button.dataset.toggleDelete);
  if (button.dataset.insertAfter) insertAfter(button.dataset.insertAfter);
  if (button.dataset.keepTake) keepTake(button.dataset.keepTake);
  if (button.dataset.toggleTakeDelete) toggleTakeDelete(button.dataset.toggleTakeDelete);
});

window.addEventListener("beforeunload", (e) => {
  if (!dirty) return;
  e.preventDefault();
  e.returnValue = "";
});

window.addEventListener("pagehide", () => {
  if (!lockToken || !currentProjectId) return;
  stopHeartbeat();
  const body = JSON.stringify(lockPayload());
  if (navigator.sendBeacon) {
    navigator.sendBeacon(`/api/lock/release?project=${encodeURIComponent(currentProjectId)}`, body);
  }
});

$("saveBtn").addEventListener("click", () => saveState(false));
$("forceSaveBtn").addEventListener("click", () => {
  if (!confirm("强制覆盖会用当前页面内容覆盖磁盘上的新版本。继续？")) return;
  saveState(true);
});
$("exportBtn").addEventListener("click", () => exportState(false));
$("renderBtn").addEventListener("click", () => exportState(true));
$("acquireLockBtn").addEventListener("click", () => acquireLock(false));
$("takeoverLockBtn").addEventListener("click", () => {
  const owner = lockStatus?.lock?.ownerName || "其他浏览器";
  if (!confirm(`确定接管 ${owner} 的编辑权？对方页面会变成只读。`)) return;
  acquireLock(true);
});
$("releaseLockBtn").addEventListener("click", () => releaseLock());
$("reloadBtn").addEventListener("click", () => {
  if (!confirm("从本地状态重新载入，未保存的页面改动会丢失。继续？")) return;
  loadData(currentProjectId, { force: true });
});
$("projectSelect").addEventListener("change", (e) => loadData(e.target.value));
$("candidateModeBtn").addEventListener("click", () => {
  navMode = "candidates";
  reviewMode = "candidates";
  qaFilter = "all";
  renderAll();
});
$("lineModeBtn").addEventListener("click", () => {
  navMode = navMode === "qa" ? "qa" : "script";
  reviewMode = "lines";
  lastTextMode = "lines";
  if (navMode !== "qa") qaFilter = "all";
  renderAll();
});
$("continuousModeBtn").addEventListener("click", () => {
  navMode = navMode === "qa" ? "qa" : "script";
  reviewMode = "continuous";
  lastTextMode = "continuous";
  if (navMode !== "qa") qaFilter = "all";
  renderAll();
});
$("finalModeBtn").addEventListener("click", () => {
  navMode = "script";
  reviewMode = "final";
  qaFilter = "all";
  showDeletedOnly = false;
  renderAll();
});
$("scriptNavBtn").addEventListener("click", () => {
  navMode = "script";
  qaFilter = "all";
  reviewMode = lastTextMode;
  renderAll();
});
$("qaNavBtn").addEventListener("click", () => {
  navMode = "qa";
  qaFilter = "focus";
  reviewMode = lastTextMode;
  renderAll();
});
$("statsNavBtn").addEventListener("click", () => {
  navMode = "stats";
  reviewMode = "stats";
  renderAll();
});
$("showDeleted").addEventListener("click", () => {
  showDeletedOnly = !showDeletedOnly;
  $("showDeleted").classList.toggle("active", showDeletedOnly);
  renderAll();
});
$("prevDeleted").addEventListener("click", () => jumpDeleted(-1));
$("nextDeleted").addEventListener("click", () => jumpDeleted(1));
$("restoreSuggested").addEventListener("click", () => {
  if (!requireEdit()) return;
  const count = state.scriptLines.filter(line => isSuggestedDeleteLine(line)).length;
  if (!confirm(`恢复建议删除线会重置当前所有删除线，并按来源重新标记 ${count} 行。继续？`)) return;
  pushUndoSnapshot("restore-suggested");
  state.scriptLines.forEach(line => line.deleted = isSuggestedDeleteLine(line));
  setDirty();
  renderAll();
});
$("clearDeleted").addEventListener("click", () => {
  if (!requireEdit()) return;
  const count = state.scriptLines.filter(line => line.deleted).length;
  if (!confirm(`确定取消全部 ${count} 条删除线？这会暂时保留所有内容，需要保存后才写入磁盘。`)) return;
  pushUndoSnapshot("clear-deleted");
  state.scriptLines.forEach(line => line.deleted = false);
  setDirty();
  renderAll();
});
$("undoBtn").addEventListener("click", () => undoEdit());
$("redoBtn").addEventListener("click", () => redoEdit());
$("timelineExpandBtn").addEventListener("click", () => toggleTimelineExpanded());
$("timelineTrack").addEventListener("click", handleTimelineClick);
$("waveform").addEventListener("click", handleTimelineClick);
$("timelinePlayBtn").addEventListener("click", () => toggleTimelinePlayback());
$("inspectPlayBtn").addEventListener("click", () => playSelectedDeleteInterval());
$("inspectRestoreBtn").addEventListener("click", () => restoreSelectedDeleteInterval());
$("nudgeStartBack").addEventListener("click", () => nudgeSelectedDeleteBoundary("start", -0.1));
$("nudgeStartForward").addEventListener("click", () => nudgeSelectedDeleteBoundary("start", 0.1));
$("nudgeEndBack").addEventListener("click", () => nudgeSelectedDeleteBoundary("end", -0.1));
$("nudgeEndForward").addEventListener("click", () => nudgeSelectedDeleteBoundary("end", 0.1));
$("timelineSpeed").addEventListener("change", () => {
  applyTimelineMediaSettings(document.querySelector("[data-source-media]"));
  applyTimelineMediaSettings(document.querySelector("[data-edited-media]"));
});
$("timelineVolume").addEventListener("input", () => {
  applyTimelineMediaSettings(document.querySelector("[data-source-media]"));
  applyTimelineMediaSettings(document.querySelector("[data-edited-media]"));
});
$("timelineZoom").addEventListener("input", (e) => setTimelineZoom(e.target.value));
$("timelinePan").addEventListener("input", (e) => setTimelinePan(e.target.value));

if (location.protocol === "file:") {
  setStatus("当前是 file:// 静态页，请打开 http://127.0.0.1:8765；静态页不能可靠保存、导出或读取最新稿。", "danger-text");
} else {
  loadProjects().catch(err => {
    console.error(err);
    setStatus(`载入失败：${err.message}`, "danger-text");
  });
}
