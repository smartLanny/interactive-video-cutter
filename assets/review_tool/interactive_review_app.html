<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交互式全文稿审片</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f3ed;
    --paper: #fffefa;
    --ink: #24211d;
    --muted: #746d64;
    --faint: #aaa196;
    --line: #dfd6ca;
    --line-strong: #cbbdab;
    --panel: #fffefa;
    --panel-soft: #f8f4ed;
    --accent: #966317;
    --accent-soft: #f0dec6;
    --danger: #9d3d32;
    --danger-soft: #f6e4dd;
    --ok: #1d7c46;
    --info: #2866b2;
    --nav: #f8f5ef;
    --timeline-height: 84px;
    --shadow: 0 18px 44px rgba(38, 28, 17, 0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 18px 18px, rgba(70, 52, 31, 0.018) 0 1px, transparent 1px 100%),
      linear-gradient(180deg, #fbfaf6 0%, var(--bg) 100%);
    background-size: 24px 24px, auto;
    line-height: 1.45;
    padding-bottom: var(--timeline-height);
  }
  body.timeline-expanded {
    --timeline-height: 192px;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 12;
    display: grid;
    grid-template-columns: minmax(300px, 0.85fr) minmax(360px, 560px) minmax(320px, 0.85fr);
    gap: 18px;
    align-items: center;
    min-height: 64px;
    padding: 0 22px;
    background: rgba(255, 254, 250, 0.96);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(12px);
  }
  .topbar-left,
  .topbar-right,
  .save-state {
    display: flex;
    align-items: center;
    min-width: 0;
  }
  .topbar-left { gap: 12px; }
  .topbar-right { justify-content: flex-end; gap: 8px; }
  h1, .project-title {
    margin: 0;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 16px;
    font-weight: 680;
    letter-spacing: 0;
  }
  .project-title small {
    color: var(--muted);
    font-size: 13px;
    font-weight: 520;
  }
  .save-state {
    gap: 6px;
    color: var(--muted);
    font-size: 13px;
  }
  .save-state.ok { color: var(--ok); }
  .save-state.dirty { color: var(--accent); }
  .save-state.danger-text { color: var(--danger); }
  .search-wrap {
    position: relative;
    min-width: 0;
  }
  .search-wrap::before {
    content: "";
    position: absolute;
    left: 12px;
    top: 50%;
    width: 13px;
    height: 13px;
    border: 1.7px solid var(--muted);
    border-radius: 50%;
    transform: translateY(-55%);
    opacity: 0.72;
  }
  .search-wrap::after {
    content: "";
    position: absolute;
    left: 24px;
    top: 34px;
    width: 7px;
    height: 1.7px;
    background: var(--muted);
    transform: rotate(45deg);
    opacity: 0.72;
  }
  .actions, .tool-buttons, .line-actions, .timeline-actions, .timeline-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .actions { justify-content: flex-end; }
  .view-toggle {
    display: inline-flex;
    flex: 0 0 auto;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    background: #f1ece4;
  }
  .view-toggle button {
    border: 0;
    border-radius: 0;
    background: transparent;
    min-width: 72px;
    padding: 7px 14px;
  }
  .view-toggle button.active {
    background: #f7ead9;
    color: var(--accent);
    box-shadow: inset 0 0 0 1px #e7caa6;
  }
  button, input, select, [contenteditable] {
    font: inherit;
  }
  button {
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 7px 10px;
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
    font-size: 13px;
  }
  .sub {
    color: var(--muted);
    font-size: 13px;
  }
  button:hover { border-color: var(--line-strong); }
  button:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }
  button.primary {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
  }
  button.danger { color: var(--danger); }
  button[hidden] { display: none; }
  button.active {
    border-color: #d8b17d;
    background: #fff7ea;
    color: var(--accent);
  }
  .icon-btn {
    width: 34px;
    height: 34px;
    display: inline-grid;
    place-items: center;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--ink);
  }
  .icon-btn svg {
    width: 18px;
    height: 18px;
    stroke-width: 1.8;
  }
  .icon-btn:hover {
    background: #f1ece4;
  }
  .status {
    min-height: 0;
    max-width: 112px;
    overflow: hidden;
    color: var(--muted);
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12px;
  }
  .status.ok { color: var(--ok); }
  .status.danger-text { color: var(--danger); }
  .app-shell {
    display: grid;
    grid-template-columns: 74px minmax(0, 1fr);
    min-height: calc(100vh - 64px - var(--timeline-height));
  }
  .side-nav {
    position: sticky;
    top: 64px;
    height: calc(100vh - 64px - var(--timeline-height));
    display: grid;
    align-content: start;
    gap: 6px;
    padding: 28px 8px;
    background: rgba(248, 245, 239, 0.88);
    border-right: 1px solid var(--line);
  }
  .side-nav button {
    position: relative;
    display: grid;
    justify-items: center;
    gap: 5px;
    min-height: 62px;
    padding: 8px 4px;
    border: 0;
    border-radius: 8px;
    color: var(--muted);
    background: transparent;
  }
  .side-nav button svg {
    width: 20px;
    height: 20px;
    stroke-width: 1.7;
  }
  .side-nav button span {
    font-size: 12px;
    line-height: 1.1;
  }
  .side-nav button.active {
    color: var(--accent);
    background: #fff7ea;
  }
  .side-nav button.active::before {
    content: "";
    position: absolute;
    left: -8px;
    top: 9px;
    bottom: 9px;
    width: 3px;
    border-radius: 999px;
    background: var(--accent);
  }
  .project-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    min-width: 0;
  }
  .lock-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-top: 6px;
  }
  .lock-status {
    color: var(--muted);
    font-size: 13px;
  }
  .lock-status.locked {
    color: var(--danger);
  }
  .lock-status.held {
    color: var(--ok);
  }
  select {
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 6px 8px;
    background: #fff;
    max-width: 260px;
    min-width: 140px;
  }
  .review-column {
    min-width: 0;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    min-height: 0;
  }
  #sourceMediaMount,
  #editedMediaMount {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
  }
  audio, video { width: 1px; height: 1px; display: block; }
  .metrics {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 14px;
    padding: 0;
    color: var(--muted);
  }
  .metric {
    border: 0;
    padding: 0;
    background: transparent;
    font-size: 13px;
    white-space: nowrap;
  }
  .metric span { color: var(--faint); margin-right: 4px; }
  main.review-layout {
    min-height: calc(100vh - 64px - var(--timeline-height));
    padding: 16px 30px 30px;
    background:
      linear-gradient(90deg, rgba(255, 254, 250, 0.62), rgba(255, 254, 250, 0.92) 13%, rgba(255, 254, 250, 0.92) 88%, rgba(255, 254, 250, 0.48)),
      linear-gradient(180deg, rgba(255,255,255,0.64), rgba(250,247,241,0.34));
  }
  .toolbar {
    display: grid;
    grid-template-columns: minmax(220px, auto) auto minmax(220px, 1fr) auto;
    gap: 10px 18px;
    align-items: center;
    position: sticky;
    top: 64px;
    z-index: 3;
    margin: 0;
    max-width: none;
    padding: 10px 0 13px;
    border-bottom: 1px solid var(--line);
    background: rgba(255, 254, 250, 0.94);
    backdrop-filter: blur(10px);
  }
  .filter-info {
    color: var(--muted);
    font-size: 13px;
    white-space: nowrap;
  }
  .review-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-width: 0;
    grid-column: 1 / -1;
  }
  .review-filters button {
    padding: 5px 8px;
    font-size: 12px;
  }
  .review-filters .filter-count {
    margin-left: 4px;
    color: inherit;
    opacity: 0.72;
    font-variant-numeric: tabular-nums;
  }
  .toolbar .tool-buttons {
    justify-content: flex-start;
    display: none;
  }
  .bulk-menu {
    position: relative;
  }
  .bulk-menu summary {
    list-style: none;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 10px;
    background: #fff;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .bulk-menu summary::-webkit-details-marker {
    display: none;
  }
  .bulk-menu[open] summary {
    border-color: #a8b2c2;
  }
  .bulk-panel {
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    z-index: 8;
    display: grid;
    gap: 6px;
    min-width: 150px;
    padding: 8px;
    border: 1px solid var(--line);
    background: #fff;
    box-shadow: 0 10px 20px rgba(15, 23, 42, 0.10);
  }
  .bulk-panel button {
    width: 100%;
    text-align: left;
  }
  input[type="search"] {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 34px;
    background: #fff;
    color: var(--ink);
  }
  .script {
    max-width: none;
    margin: 0;
    border: 0;
    border-radius: 0;
    background: transparent;
    overflow: visible;
    min-height: 0;
    max-height: none;
    box-shadow: none;
  }
  .line-table-head {
    display: grid;
    grid-template-columns: 34px 58px minmax(0, 1fr) 260px;
    gap: 10px;
    align-items: center;
    min-height: 38px;
    padding: 0 10px;
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
  }
  .line-row {
    display: grid;
    grid-template-columns: 34px 58px minmax(0, 1fr) 260px;
    gap: 10px;
    align-items: center;
    min-height: 53px;
    padding: 0 10px;
    border-bottom: 1px solid var(--line);
  }
  .line-row:last-child { border-bottom: 0; }
  .line-row.active {
    outline: 0;
    background: #faf0e1;
  }
  .line-row.deleted {
    background: transparent;
  }
  .line-row.deleted .line-text {
    text-decoration: line-through;
    color: var(--danger);
    text-decoration-thickness: 1.5px;
  }
  .line-row.review-focus,
  .take-row.review-focus {
    box-shadow: inset 2px 0 0 rgba(137, 82, 65, 0.70);
  }
  .line-row.review-asr:not(.review-focus),
  .take-row.review-asr:not(.review-focus) {
    box-shadow: inset 2px 0 0 rgba(153, 110, 44, 0.50);
  }
  .line-row.review-metric:not(.review-focus):not(.review-asr),
  .take-row.review-metric:not(.review-focus):not(.review-asr) {
    box-shadow: inset 2px 0 0 rgba(69, 107, 144, 0.42);
  }
  .line-row.review-term:not(.review-focus):not(.review-asr):not(.review-metric),
  .take-row.review-term:not(.review-focus):not(.review-asr):not(.review-metric) {
    box-shadow: inset 2px 0 0 rgba(111, 89, 128, 0.40);
  }
  .line-row.review-delete-suggestion:not(.review-focus):not(.review-asr):not(.review-metric):not(.review-term),
  .take-row.review-delete-suggestion:not(.review-focus):not(.review-asr):not(.review-metric):not(.review-term) {
    box-shadow: inset 2px 0 0 rgba(119, 65, 57, 0.42);
  }
  .line-row.pause .line-text {
    color: var(--muted);
    font-style: italic;
  }
  .line-number-button {
    display: inline-grid;
    place-items: center;
    min-width: 28px;
    height: 28px;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .line-number-button:hover,
  .line-row.time-expanded .line-number-button {
    background: #fff7ea;
    color: var(--accent);
  }
  .line-play-marker {
    display: grid;
    place-items: center;
    color: #c9820d;
    font-size: 15px;
    line-height: 1;
  }
  .line-row:not(.active) .line-play-marker {
    color: #a9a29a;
    font-size: 13px;
  }
  .line-content {
    min-width: 0;
  }
  .line-status {
    justify-self: end;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    min-width: 0;
  }
  .line-status .qa-flags {
    justify-content: flex-end;
    margin-top: 0;
  }
  .line-hint-empty {
    color: var(--faint);
    font-size: 12px;
  }
  .candidate-groups {
    display: grid;
    gap: 12px;
    padding: 12px;
  }
  .candidate-group {
    border: 1px solid var(--line);
    border-radius: 7px;
    background: #fff;
    overflow: hidden;
  }
  .candidate-head {
    display: grid;
    gap: 5px;
    padding: 10px 12px;
    background: var(--panel-soft);
    border-bottom: 1px solid var(--line);
  }
  .reference-text {
    font-size: 15px;
    line-height: 1.65;
  }
  .candidate-meta {
    color: var(--muted);
    font-size: 12px;
  }
  .candidate-summary {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    color: var(--muted);
    font-size: 12px;
  }
  .candidate-status {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    min-height: 22px;
    border-radius: 999px;
    padding: 2px 7px;
    background: #f3eadc;
    color: #625746;
    font-size: 12px;
    font-weight: 650;
  }
  .candidate-status.adopted {
    background: #edf7ed;
    color: #2f6b3f;
  }
  .candidate-status.deleted {
    background: #f4eee9;
    color: #7a3030;
  }
  .qa-flags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 5px;
    font-size: 12px;
  }
  .qa-chip {
    display: inline-flex;
    align-items: center;
    max-width: 100%;
    min-height: 24px;
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 2px 6px;
    font-size: 11px;
    font-weight: 650;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }
  .line-status .qa-chip {
    min-height: 26px;
    padding-inline: 8px;
    font-size: 12px;
  }
  button.qa-chip {
    white-space: normal;
    cursor: pointer;
  }
  .qa-chip.flag-human {
    border-color: #fecdca;
    background: #fff1f0;
    color: #b42318;
  }
  .qa-chip.flag-review {
    border-color: #fecdd3;
    background: #fff1f3;
    color: #be123c;
  }
  .qa-chip.flag-polish {
    border-color: #c7d7fe;
    background: #eef4ff;
    color: #3538cd;
  }
  .qa-chip.flag-asr {
    border-color: #fedf89;
    background: #fffaeb;
    color: #b54708;
  }
  .qa-chip.flag-metric {
    border-color: #b2ddff;
    background: #eff8ff;
    color: #175cd3;
  }
  .qa-chip.flag-term-protected {
    border-color: #d9b8ff;
    background: #f7efff;
    color: #7a2e83;
  }
  .qa-chip.flag-term-reference {
    border-color: #99f6e4;
    background: #f0fdfa;
    color: #0f766e;
  }
  .qa-chip.flag-delete {
    border-color: #fda29b;
    background: #fff4f3;
    color: #b42318;
  }
  .qa-chip.flag-neutral {
    border-color: #d0d5dd;
    background: #f9fafb;
    color: #475467;
  }
  .take-row {
    display: grid;
    grid-template-columns: 118px minmax(0, 1fr) auto;
    gap: 12px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  .take-row:last-child { border-bottom: 0; }
  .take-row.deleted {
    background: var(--panel-soft);
    color: var(--muted);
  }
  .take-row.active {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
    background: #f8fbff;
  }
  .take-row.deleted .take-text {
    text-decoration: line-through;
    color: #7a3030;
  }
  .take-text {
    font-size: 15px;
    line-height: 1.65;
    overflow-wrap: anywhere;
  }
  .line-meta {
    display: grid;
    gap: 3px;
    color: var(--muted);
    font-size: 12px;
    justify-items: end;
  }
  .line-number {
    color: var(--muted);
    font-weight: 520;
    font-variant-numeric: tabular-nums;
  }
  .time {
    color: var(--faint);
    font-variant-numeric: tabular-nums;
  }
  .line-time-details {
    display: none;
    margin: 3px 0 1px 4px;
    color: var(--muted);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .line-row.time-expanded .line-time-details {
    display: block;
  }
  .line-row.deleted .line-time-details { color: #d45b50; }
  .line-text {
    min-height: 0;
    padding: 3px 4px;
    border-radius: 5px;
    outline: 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-family: "Songti SC", "STSong", "SimSun", serif;
    font-size: 17px;
    line-height: 1.62;
  }
  .line-text:focus {
    background: #fffaf2;
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .line-actions {
    justify-content: flex-end;
    min-width: 70px;
  }
  .line-row > .line-actions {
    display: none;
  }
  .small {
    padding: 5px 7px;
    font-size: 12px;
  }
  .empty {
    padding: 18px;
    color: var(--muted);
  }
  .continuous-paper {
    max-width: 980px;
    margin: 0;
    padding: 28px 44px 42px 8px;
    font-family: "Songti SC", "STSong", "SimSun", serif;
    font-size: 20px;
    line-height: 2.12;
    letter-spacing: 0;
  }
  .continuous-workspace {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 310px;
    gap: 30px;
    align-items: start;
    max-width: 1360px;
    margin: 0 auto;
  }
  .article-segment {
    position: relative;
    display: inline;
    padding: 2px 3px;
    border-radius: 5px;
    cursor: text;
  }
  .article-segment.active {
    background: transparent;
    box-shadow: inset 0 -2px 0 #e5bd7f;
  }
  .article-segment.deleted {
    color: var(--danger);
    background: var(--danger-soft);
    text-decoration: line-through;
    text-decoration-thickness: 1.5px;
  }
  .article-segment.review-focus::before,
  .article-segment.review-asr::before,
  .article-segment.review-metric::before,
  .article-segment.review-term::before,
  .article-segment.review-delete-suggestion::before {
    content: "";
    display: inline-block;
    width: 5px;
    height: 5px;
    margin: 0 4px 2px 1px;
    border-radius: 50%;
    background: rgba(153, 110, 44, 0.45);
  }
  .article-segment.review-focus::before { background: rgba(137, 82, 65, 0.65); }
  .article-segment.review-metric::before { background: rgba(69, 107, 144, 0.42); }
  .article-segment.review-term::before { background: rgba(111, 89, 128, 0.40); }
  .article-segment.review-delete-suggestion::before { background: rgba(119, 65, 57, 0.42); }
  .continuous-text {
    min-height: 0;
    padding: 0;
    font-size: inherit;
    line-height: inherit;
    border-radius: 4px;
  }
  .final-paper {
    max-width: 920px;
    margin: 0 auto;
    padding: 28px 8px 44px;
    font-family: "Songti SC", "STSong", "SimSun", serif;
    font-size: 20px;
    line-height: 2.12;
  }
  .final-segment {
    display: inline;
    padding: 0;
  }
  .duration-pill {
    display: inline-flex;
    align-items: center;
    height: 20px;
    margin-left: 6px;
    padding: 0 7px;
    border: 1px solid #e7b9ad;
    border-radius: 999px;
    background: #fff6f3;
    color: var(--danger);

  }

  }
  .waveform-range {

    stroke: rgba(144, 101, 46, 0.25);

  }

  .export-popover {

  @media (max-width: 980px) {

  <h2>最近导出</h2>
  <div class="export-list" id="exportResults">还没有导出</div>
</section>

<script>
const $ = (id) => document.getElementById(id);
const VISIBLE_PUNCT_RE = /[，,、；;：:。！？!?]/g;
const DECIMAL_DOT_TOKEN = "__DECIMAL_DOT__";
const fmt = (s) => {
  s = Math.max(0, Number(s) || 0);
  const m = Math.floor(s / 60);
  const sec = (s - m * 60).toFixed(2).padStart(5, "0");
  return `${String(m).padStart(2, "0")}:${sec}`;
};
const parseNum = (value) => Number.parseFloat(String(value).trim()) || 0;

let projects = [];
let currentProjectId = "";
let meta = {};
let state = { scriptLines: [], useScriptLines: true };
let activeLineId = null;
let showDeletedOnly = false;
let baseRevision = null;
let dirty = false;
let saveConflict = null;
let stopHandler = null;
let stopMedia = null;
let stopPollTimer = null;
let editedSkipHandler = null;
let editedSkipPollTimer = null;
let editedSkipMedia = null;
let busyMode = "";
let lockToken = "";
let lockStatus = { locked: false, heldByMe: false };
let heartbeatTimer = null;
let reviewMode = "lines";
let navMode = "script";
let lastTextMode = "lines";
let timelineExpanded = false;
let selectedDeleteInterval = null;
let timelineSourceTime = 0;
let timelineRenderFrame = null;
let expandedTimeLineId = null;
let timelineZoom = 1;
let timelineViewStart = 0;
let waveformPeaks = [];
let waveformSignature = "";
let waveformLoading = false;
let waveformError = "";
let qaFilter = "all";
let undoStack = [];
let redoStack = [];
let pendingTextSnapshot = false;
let textHistoryTimer = null;
const MAX_HISTORY = 80;
const REVIEW_FILTERS = [
  { id: "all", label: "全部" },
  { id: "focus", label: "重点" },
  { id: "asr-gap", label: "ASR空窗" },
  { id: "dense-metric", label: "密集数字" },
  { id: "term-risk", label: "术语风险" },
  { id: "delete-suggested", label: "删除建议" },
];
const QA_FLAG_DEFS = [
  { keys: ["semantic-llm-review"], label: "语义复核", css: "flag-review", category: "focus", filter: "focus", priority: true, search: ["语义", "复核", "LLM复核", "值得再看"] },
  { keys: ["llm-suggestion-medium"], label: "中等建议", css: "flag-polish", category: "focus", filter: "focus", priority: true, search: ["中等建议", "建议再看", "LLM建议"] },
  { keys: ["llm-suggestion-pending"], label: "建议待定", css: "flag-neutral", category: "focus", filter: "focus", priority: true, search: ["待定", "待确认", "建议再看"] },
  { keys: ["keep-after-review", "llm-delete-guard"], label: "删前保后待审", css: "flag-review", category: "focus", filter: "focus", priority: true, search: ["删前保后", "复念", "后版", "待审"] },
  { keys: ["needs_human", "needs-human"], label: "人工复核", css: "flag-human", category: "focus", filter: "focus", priority: true, search: ["重点", "待审重点", "人审", "人工确认"] },
  { keys: ["needs-review", "needs_review"], label: "待审重点", css: "flag-review", category: "focus", filter: "focus", priority: true, search: ["复核", "重点审查", "人工听"] },
  { keys: ["ai-polish-focus"], label: "AI打磨重点", css: "flag-polish", category: "focus", filter: "focus", priority: true, search: ["AI polish", "重点打磨", "改稿重点"] },
  { keys: ["asr-timestamp-gap"], label: "ASR空窗", css: "flag-asr", category: "asr-gap", filter: "asr-gap", priority: true, search: ["时间戳空窗", "空窗", "断点", "长停顿"] },
  { keys: ["targeted-quality-asr-fix"], label: "定向ASR修正", css: "flag-asr", category: "focus", filter: "focus", priority: true, search: ["ASR修正", "定向复听", "质量ASR"] },
  { keys: ["dense-metric-review"], label: "密集数字", css: "flag-metric", category: "dense-metric", filter: "dense-metric", priority: false, search: ["数字风险", "参数密集", "跑分", "规格"] },
  { keys: ["long-window-review"], label: "长窗口", css: "flag-metric", category: "dense-metric", filter: "dense-metric", priority: false, search: ["长句", "长时间段", "断句风险"] },
  { keys: ["protected-term-review"], label: "保护术语", css: "flag-term-protected", category: "term-risk", filter: "term-risk", priority: false, search: ["术语风险", "保护词", "专名", "型号"] },
  { keys: ["term-not-in-reference"], label: "参考外术语", css: "flag-term-reference", category: "term-risk", filter: "term-risk", priority: false, search: ["术语风险", "参考未出现", "参考外", "专名"] },
  { keys: ["off-reference"], label: "参考外口播", css: "flag-neutral", category: "", filter: "", priority: false, search: ["参考外", "非文案", "off reference"] },
  { keys: ["suggested-delete", "delete-suggestion", "ai-polish-delete", "pause", "superseded-take"], label: "删除建议", css: "flag-delete", category: "delete-suggested", filter: "delete-suggested", priority: false, search: ["删点", "建议删除", "删除线", "AI删除", "停顿", "旧take"] },
];
const REVIEW_ROW_CLASSES = ["review-focus", "review-asr", "review-metric", "review-term", "review-delete-suggestion"];

function makeId(prefix) {
  const value = globalThis.crypto?.randomUUID ? globalThis.crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
  return `${prefix}-${value}`;
}

const clientId = (() => {
  const key = "interactiveReviewClientId";
  let value = localStorage.getItem(key);
  if (!value) {
    value = makeId("client");
    localStorage.setItem(key, value);
  }
  return value;
})();

const tabId = (() => {
  const key = "interactiveReviewTabId";
  let value = sessionStorage.getItem(key);
  if (!value) {
    value = makeId("tab");
    sessionStorage.setItem(key, value);
  }
  return value;
})();

function ownerName() {
  return `浏览器 ${clientId.slice(-6)}`;
}

function lockStorageKey(projectId = currentProjectId) {
  return `interactiveReviewLockToken:${projectId}`;
}

function canEdit() {
  return Boolean(lockStatus?.heldByMe && lockToken);
}

function requireEdit() {
  if (canEdit()) return true;
  setStatus("当前是只读状态，需要先获取或接管编辑权。", "danger-text");
  return false;
}

function setStatus(text, cls = "") {
  const el = $("status");
  el.className = `status ${cls}`;
  el.textContent = text;
}

function setBusy(mode = "") {
  busyMode = mode;
  renderControls();
}

function renderLockInfo() {
  const info = $("lockInfo");
  const lock = lockStatus?.lock;
  info.className = "lock-status";
  if (canEdit()) {
    info.textContent = `已取得编辑权：${lock?.ownerName || ownerName()}`;
    info.classList.add("held");
  } else if (lockStatus?.locked) {
    info.textContent = `只读：${lock?.ownerName || "其他浏览器"} 正在编辑`;
    info.classList.add("locked");
  } else {
    info.textContent = "未取得编辑权";
  }
  $("acquireLockBtn").hidden = canEdit() || Boolean(lockStatus?.locked);
  $("takeoverLockBtn").hidden = canEdit() || !lockStatus?.locked;
  $("releaseLockBtn").hidden = !canEdit();
}

function renderControls() {
  const busy = Boolean(busyMode);
  const readOnly = !canEdit();
  $("saveBtn").disabled = busy || readOnly;
  $("exportBtn").disabled = busy || readOnly;
  $("renderBtn").disabled = busy || readOnly;
  $("forceSaveBtn").disabled = busy || readOnly;
  $("restoreSuggested").disabled = busy || readOnly;
  $("clearDeleted").disabled = busy || readOnly;
  $("reloadBtn").disabled = busy;
  $("projectSelect").disabled = busy;
  $("saveBtn").title = busyMode === "saving" ? "保存中" : "保存";
  $("exportBtn").title = busyMode === "exporting" ? "导出中" : "导出";
  $("renderBtn").title = busyMode === "rendering" ? "渲染中" : "渲染预览";
  $("undoBtn").disabled = busy || readOnly || !undoStack.length;
  $("redoBtn").disabled = busy || readOnly || !redoStack.length;
  renderLockInfo();
}

function escapeHtml(text) {
  return String(text ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}

function normalizeFlagKey(flag) {
  return String(flag || "").trim().toLowerCase();
}

function flagDefFor(flag) {
  const key = normalizeFlagKey(flag);
  const dashed = key.replace(/_/g, "-");
  return QA_FLAG_DEFS.find(def => def.keys.includes(key) || def.keys.includes(dashed)) || null;
}

function inferredFlagCategory(flag) {
  const key = normalizeFlagKey(flag).replace(/_/g, "-");
  if (key.includes("timestamp-gap") || key.includes("asr-gap")) return "asr-gap";
  if (key.includes("metric") || key.includes("dense")) return "dense-metric";
  if (key.includes("term")) return "term-risk";
  if (key.includes("delete")) return "delete-suggested";
  if (key.includes("needs") || key.includes("review") || key.includes("focus")) return "focus";
  return "";
}

function flagCategory(flag) {
  return flagDefFor(flag)?.category || inferredFlagCategory(flag);
}

function flagFilterId(flag) {
  const def = flagDefFor(flag);
  if (def?.filter) return def.filter;
  return flagCategory(flag) || "";
}

function flagLabel(flag) {
  return flagDefFor(flag)?.label || String(flag || "").trim();
}

function flagCssClass(flag) {
  const def = flagDefFor(flag);
  if (def?.css) return def.css;
  const category = flagCategory(flag);
  if (category === "asr-gap") return "flag-asr";
  if (category === "dense-metric") return "flag-metric";
  if (category === "term-risk") return "flag-term-protected";
  if (category === "delete-suggested") return "flag-delete";
  if (category === "focus") return "flag-review";
  return "flag-neutral";
}

function uniquePush(list, seen, value) {
  const text = String(value || "").trim();
  if (!text) return;
  const key = normalizeFlagKey(text);
  if (seen.has(key)) return;
  seen.add(key);
  list.push(text);
}

function isReviewItemSuggestedDelete(item, relatedLines = []) {
  return Boolean((item && isSuggestedDeleteLine(item)) || relatedLines.some(line => line && isSuggestedDeleteLine(line)));
}

function reviewItemFlags(item, relatedLines = []) {
  const flags = [];
  const seen = new Set();
  [item, ...relatedLines].forEach(source => {
    (Array.isArray(source?.qaFlags) ? source.qaFlags : []).forEach(flag => uniquePush(flags, seen, flag));
  });
  if (isReviewItemSuggestedDelete(item, relatedLines)) uniquePush(flags, seen, "suggested-delete");
  return flags;
}

function hasPriorityFlag(item, relatedLines = []) {
  return reviewItemFlags(item, relatedLines).some(flag => {
    const def = flagDefFor(flag);
    return Boolean(def?.priority || flagCategory(flag) === "focus");
  });
}

function reviewItemMatchesFilter(item, filterId, relatedLines = []) {
  if (!filterId || filterId === "all") return true;
  if (filterId === "focus") return hasPriorityFlag(item, relatedLines);
  if (filterId === "delete-suggested") {
    return isReviewItemSuggestedDelete(item, relatedLines)
      || reviewItemFlags(item, relatedLines).some(flag => flagCategory(flag) === "delete-suggested");
  }
  return reviewItemFlags(item, relatedLines).some(flag => flagCategory(flag) === filterId);
}

function lineMatchesReviewFilter(line, filterId = qaFilter) {
  return reviewItemMatchesFilter(line, filterId);
}

function activeReviewFilterLabel() {
  return REVIEW_FILTERS.find(item => item.id === qaFilter)?.label || "全部";
}

function reviewFilterCounts() {
  return Object.fromEntries(REVIEW_FILTERS.map(filter => [
    filter.id,
    filter.id === "all"
      ? state.scriptLines.length
      : state.scriptLines.filter(line => lineMatchesReviewFilter(line, filter.id)).length,
  ]));
}

function renderReviewFilters() {
  const mount = $("reviewFilters");
  if (!mount) return;
  const counts = reviewFilterCounts();
  mount.innerHTML = REVIEW_FILTERS.map(filter => {
    const active = qaFilter === filter.id;
    return `<button type="button" class="small ${active ? "active" : ""}" data-review-filter="${escapeHtml(filter.id)}" aria-pressed="${active ? "true" : "false"}">${escapeHtml(filter.label)}<span class="filter-count">${counts[filter.id] || 0}</span></button>`;
  }).join("");
}

function flagSearchTerms(flag) {
  const def = flagDefFor(flag);
  const raw = String(flag || "").trim();
  return [
    raw,
    raw.replace(/[-_]/g, " "),
    flagLabel(raw),
    ...(def?.search || []),
  ].filter(Boolean);
}

function reviewItemSearchText(item, relatedLines = [], extraText = "") {
  const lineText = relatedLines.map(line => `${line.text || ""} ${line.source || ""}`).join(" ");
  const flagText = reviewItemFlags(item, relatedLines).flatMap(flag => flagSearchTerms(flag)).join(" ");
  return `${extraText || ""} ${item?.text || ""} ${item?.source || ""} ${lineText} ${flagText}`.toLowerCase();
}

function reviewFlagsHtml(item, relatedLines = []) {
  const flags = reviewItemFlags(item, relatedLines);
  if (!flags.length) return "";
  const chips = flags.map(flag => {
    const raw = String(flag || "").trim();
    const label = flagLabel(raw);
    const filter = flagFilterId(raw);
    const title = label;
    const attrs = filter ? ` type="button" data-review-filter="${escapeHtml(filter)}"` : "";
    const tag = filter ? "button" : "span";
    return `<${tag}${attrs} class="qa-chip ${escapeHtml(flagCssClass(raw))}" title="${escapeHtml(title)}">${escapeHtml(label)}</${tag}>`;
  }).join("");
  return `<div class="qa-flags" aria-label="待审重点">${chips}</div>`;
}

function lineHintsHtml(line) {
  const flags = reviewFlagsHtml(line);
  if (flags) return flags;
  if (line.deleted) {
    return `<div class="qa-flags" aria-label="删除提示"><button type="button" class="qa-chip flag-delete" data-review-filter="delete-suggested" title="删除段">删除段</button></div>`;
  }
  return `<span class="line-hint-empty">—</span>`;
}

function reviewClassListForItem(item, relatedLines = []) {
  return [
    reviewItemMatchesFilter(item, "focus", relatedLines) ? "review-focus" : "",
    reviewItemMatchesFilter(item, "asr-gap", relatedLines) ? "review-asr" : "",
    reviewItemMatchesFilter(item, "dense-metric", relatedLines) ? "review-metric" : "",
    reviewItemMatchesFilter(item, "term-risk", relatedLines) ? "review-term" : "",
    reviewItemMatchesFilter(item, "delete-suggested", relatedLines) ? "review-delete-suggestion" : "",
  ].filter(Boolean).join(" ");
}

function applyReviewRowClasses(row, item, relatedLines = []) {
  row.classList.remove(...REVIEW_ROW_CLASSES);
  reviewClassListForItem(item, relatedLines).split(" ").filter(Boolean).forEach(cls => row.classList.add(cls));
}

function cleanReviewText(text) {
  return String(text || "")
    .replace(/\s+/g, " ")
    .replace(/(\d)\.(\d)/g, `$1${DECIMAL_DOT_TOKEN}$2`)
    .replace(/([A-Za-z0-9%])\s*[，,、；;：:。！？!?]\s*(?=[A-Za-z0-9])/g, "$1 ")
    .replace(VISIBLE_PUNCT_RE, "")
    .replace(/\./g, "")
    .replaceAll(DECIMAL_DOT_TOKEN, ".")
    .replace(/\s+/g, " ")
    .trim();
}

function shortRevision(value) {
  return value ? String(value).slice(0, 22) : "无";
}

function projectLabel(project) {
  const type = project.mediaType === "video" ? "视频" : "音频";
  return `${project.title} (${type})`;
}

function apiPath(path) {
  return `${path}?project=${encodeURIComponent(currentProjectId)}`;
}

function apiPathWithLock(path) {
  const query = new URLSearchParams({
    project: currentProjectId,
    ownerId: clientId,
    lockToken: lockToken || "",
  });
  return `${path}?${query.toString()}`;
}

function lockPayload(extra = {}) {
  return {
    ownerId: clientId,
    ownerName: ownerName(),
    tabId,
    lockToken,
    ...extra,
  };
}

function applyLockStatus(nextStatus = {}) {
  lockStatus = nextStatus || { locked: false, heldByMe: false };
  if (lockStatus.heldByMe && lockStatus.lock?.token) {
    lockToken = lockStatus.lock.token;
    localStorage.setItem(lockStorageKey(), lockToken);
  } else if (!lockStatus.heldByMe) {
    lockToken = "";
    localStorage.removeItem(lockStorageKey());
  }
  renderControls();
  renderAll();
}

function stopHeartbeat() {
  if (heartbeatTimer) clearInterval(heartbeatTimer);
  heartbeatTimer = null;
}

function startHeartbeat() {
  stopHeartbeat();
  if (!canEdit()) return;
  heartbeatTimer = setInterval(() => heartbeatLock(), 20000);
}

async function acquireLock(takeover = false) {
  if (!currentProjectId) return false;
  const endpoint = takeover ? "/api/lock/takeover" : "/api/lock/acquire";
  const res = await fetch(apiPath(endpoint), {
    method: "POST",
    body: JSON.stringify(lockPayload(takeover ? { reason: "manual takeover" } : {})),
  });
  const data = await res.json();
  if (!res.ok || data.ok === false) {
    applyLockStatus({ locked: Boolean(data.locked), heldByMe: false, lock: data.lock });
    setStatus(data.locked ? `只读：${data.lock?.ownerName || "其他浏览器"} 正在编辑` : `获取编辑权失败：${data.error}`, "danger-text");
    return false;
  }
  lockToken = data.token || data.lock?.token || lockToken;
  localStorage.setItem(lockStorageKey(), lockToken);
  applyLockStatus({ locked: true, heldByMe: true, lock: data.lock });
  startHeartbeat();
  setStatus(takeover ? "已接管编辑权" : "已取得编辑权", "ok");
  return true;
}

async function heartbeatLock() {
  if (!canEdit()) return;
  try {
    const res = await fetch(apiPath("/api/lock/heartbeat"), {
      method: "POST",
      body: JSON.stringify(lockPayload()),
    });
    const data = await res.json();
    if (!res.ok || data.ok === false) {
      stopHeartbeat();
      applyLockStatus({ locked: Boolean(data.locked), heldByMe: false, lock: data.lock });
      setStatus("编辑锁已失效，页面切换为只读。", "danger-text");
      return;
    }
    applyLockStatus({ locked: true, heldByMe: true, lock: data.lock });
  } catch {
    // 下一次 heartbeat 再判断，避免短暂网络抖动立即踢出编辑态。
  }
}

async function releaseLock(options = {}) {
  const projectId = options.projectId || currentProjectId;
  const token = options.token || lockToken || localStorage.getItem(lockStorageKey(projectId)) || "";
  if (!projectId || !token) return;
  stopHeartbeat();
  try {
    await fetch(`/api/lock/release?project=${encodeURIComponent(projectId)}`, {
      method: "POST",
      keepalive: true,
      body: JSON.stringify({
        ownerId: clientId,
        ownerName: ownerName(),
        tabId,
        lockToken: token,
      }),
    });
  } catch {
    // release 是 best-effort；TTL 会自动过期。
  }
  if (projectId === currentProjectId) {
    lockToken = "";
    applyLockStatus({ locked: false, heldByMe: false });
  }
  localStorage.removeItem(lockStorageKey(projectId));
}

function setDirty(value = true) {
  dirty = value;
  renderProjectInfo();
  renderMetrics();
}

function cloneValue(value) {
  return JSON.parse(JSON.stringify(value ?? null));
}

function historySnapshot() {
  return {
    scriptLines: cloneValue(state.scriptLines || []),
    referenceReview: cloneValue(state.referenceReview || null),
    activeLineId,
    showDeletedOnly,
    navMode,
    reviewMode,
    lastTextMode,
    dirty,
  };
}

function historyKey(snapshot) {
  return JSON.stringify({
    scriptLines: snapshot.scriptLines,
    referenceReview: snapshot.referenceReview,
    activeLineId: snapshot.activeLineId,
    showDeletedOnly: snapshot.showDeletedOnly,
    navMode: snapshot.navMode,
    reviewMode: snapshot.reviewMode,
    lastTextMode: snapshot.lastTextMode,
  });
}

function clearHistory() {
  undoStack = [];
  redoStack = [];
  pendingTextSnapshot = false;
  if (textHistoryTimer) clearTimeout(textHistoryTimer);
  textHistoryTimer = null;
}

function pushUndoSnapshot(label = "edit") {
  if (!canEdit()) return false;
  const snapshot = historySnapshot();
  const key = historyKey(snapshot);
  if (undoStack.length && undoStack[undoStack.length - 1].key === key) return false;
  undoStack.push({ key, snapshot, label });
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack = [];
  return true;
}

function beginTextHistory() {
  if (!canEdit() || pendingTextSnapshot) return;
  pushUndoSnapshot("text");
  pendingTextSnapshot = true;
  if (textHistoryTimer) clearTimeout(textHistoryTimer);
  textHistoryTimer = setTimeout(() => {
    pendingTextSnapshot = false;
    textHistoryTimer = null;
  }, 700);
}

function restoreSnapshot(snapshot) {
  state.scriptLines = cloneValue(snapshot.scriptLines || []);
  state.referenceReview = cloneValue(snapshot.referenceReview || null);
  activeLineId = snapshot.activeLineId;
  showDeletedOnly = Boolean(snapshot.showDeletedOnly);
  navMode = snapshot.navMode || "script";
  reviewMode = snapshot.reviewMode || "lines";
  lastTextMode = snapshot.lastTextMode || (reviewMode === "continuous" ? "continuous" : "lines");
  dirty = true;
  renumberLines();
  renderAll();
  requestAnimationFrame(() => {
    if (activeLineId) scrollActiveIntoView();
  });
}

function undoEdit() {
  if (!requireEdit()) return;
  pendingTextSnapshot = false;
  if (textHistoryTimer) clearTimeout(textHistoryTimer);
  textHistoryTimer = null;
  if (!undoStack.length) {
    setStatus("没有可撤回内容", "danger-text");
    return;
  }
  redoStack.push({ key: historyKey(historySnapshot()), snapshot: historySnapshot(), label: "redo" });
  const entry = undoStack.pop();
  restoreSnapshot(entry.snapshot);
  setStatus("已撤回", "ok");
}

function redoEdit() {
  if (!requireEdit()) return;
  pendingTextSnapshot = false;
  if (textHistoryTimer) clearTimeout(textHistoryTimer);
  textHistoryTimer = null;
  if (!redoStack.length) {
    setStatus("没有可重做内容", "danger-text");
    return;
  }
  undoStack.push({ key: historyKey(historySnapshot()), snapshot: historySnapshot(), label: "undo" });
  const entry = redoStack.pop();
  restoreSnapshot(entry.snapshot);
  setStatus("已重做", "ok");
}

function renderProjectInfo() {
  const project = projects.find(item => item.id === currentProjectId);
  const dirtyText = dirty ? "未保存" : "已保存";
  const conflictText = saveConflict ? "；有保存冲突" : "";
  const info = $("projectInfo");
  info.className = `save-state ${saveConflict ? "danger-text" : dirty ? "dirty" : "ok"}`;
  info.textContent = project
    ? `${dirty ? "○" : "✓"} ${dirtyText}${conflictText}`
    : "";
  $("forceSaveBtn").hidden = !saveConflict;
  renderControls();
}

async function loadProjects() {
  const res = await fetch("/api/projects");
  const data = await res.json();
  projects = data.projects || [];
  currentProjectId = data.defaultProject || projects[0]?.id || "";
  $("projectSelect").innerHTML = projects.map(project =>
    `<option value="${escapeHtml(project.id)}">${escapeHtml(projectLabel(project))}</option>`
  ).join("");
  $("projectSelect").value = currentProjectId;
  await loadData(currentProjectId, { force: true });
}

async function loadData(projectId = currentProjectId, options = {}) {
  if (dirty && !options.force && !confirm("当前页面有未保存改动，切换或重载会丢失这些改动。继续？")) {
    $("projectSelect").value = currentProjectId;
    return;
  }
  const previousProjectId = currentProjectId;
  const previousToken = lockToken;
  if (previousProjectId && previousProjectId !== projectId) {
    await releaseLock({ projectId: previousProjectId, token: previousToken });
  }
  currentProjectId = projectId;
  $("projectSelect").value = currentProjectId;
  lockToken = localStorage.getItem(lockStorageKey()) || "";
  const res = await fetch(apiPathWithLock("/api/data"));
  const data = await res.json();
  if (!res.ok || data.ok === false) throw new Error(data.error || "载入失败");
  meta = data.meta;
  state = data.state;
  baseRevision = data.revision || meta.stateRevision || null;
  dirty = false;
  saveConflict = null;
  clearHistory();
  applyLockStatus(data.lockStatus || { locked: false, heldByMe: false });
  state.useScriptLines = true;
  if (!Array.isArray(state.scriptLines)) state.scriptLines = [];
  if (!state.referenceReview) state.referenceReview = null;
  $("pageTitle").textContent = meta.title || "交互式全文稿审片";
  document.title = meta.title || "交互式全文稿审片";
  renumberLines();
  activeLineId = state.scriptLines[0]?.id ?? null;
  timelineSourceTime = activeLineId ? parseNum(lineById(activeLineId)?.start) : 0;
  timelineZoom = 1;
  timelineViewStart = 0;
  renderAll();
  renderMediaTabs();
  setStatus(`已载入：${meta.statePath}`);
  await acquireLock(false);
}

function lineDuration(line) {
  const start = parseNum(line.start);
  const end = Math.max(start, parseNum(line.end));
  return end - start;
}

function projectDuration() {
  const maxLineEnd = Math.max(0, ...state.scriptLines.map(line => parseNum(line.end)));
  return Math.max(parseNum(meta.originalDuration), maxLineEnd, 0.05);
}

function deletedDuration() {
  return state.scriptLines.reduce((sum, line) => sum + (line.deleted ? lineDuration(line) : 0), 0);
}

function renderMetrics() {
  const deletedLines = state.scriptLines.filter(line => line.deleted).length;
  const removed = deletedDuration();
  const visibleCount = reviewMode === "final" ? finalLines().length : visibleLines().length;
  const filterActive = Boolean($("search")?.value.trim()) || showDeletedOnly || qaFilter !== "all" || navMode === "qa" || reviewMode === "final";
  const reviewCounts = reviewFilterCounts();
  $("metrics").innerHTML = [
    `<div class="metric"><span>全文</span>${state.scriptLines.length}</div>`,
    `<div class="metric"><span>待审</span>${reviewCounts.focus || 0}</div>`,
    `<div class="metric"><span>删除</span>${deletedLines}</div>`,
    `<div class="metric"><span>剪后</span>${fmt(projectDuration() - removed)}</div>`,
    filterActive ? `<div class="metric"><span>当前可见</span>${visibleCount}</div>` : "",
    activeLineId ? `<div class="metric"><span>当前</span>#${escapeHtml(lineById(activeLineId)?.index || activeLineId)}</div>` : ""
  ].filter(Boolean).join("");
  $("filterInfo").textContent = filterActive
    ? `显示 ${visibleCount} / ${state.scriptLines.length}${qaFilter !== "all" ? ` · ${activeReviewFilterLabel()}` : ""}`
    : "";
  updateEditedPreviewInfo();
  renderTimeline();
  renderProjectInfo();
}

function defaultMediaItem(items) {
  const draftAudio = (items || []).find(item => item.id === "draft" && item.type === "audio");
  return draftAudio || (items || [])[0] || null;
}

function reviewAudioItem() {
  return (meta.media || []).find(item => item.id === "draft" && item.type === "audio") || null;
}

function sourcePreviewItem() {
  const audio = reviewAudioItem();
  if (audio) return audio;
  const items = meta.media || [];
  return items.find(item => item.id === "source-video")
    || items.find(item => item.id === "source")
    || (meta.sourceMedia ? {
      id: "source",
      label: meta.mediaType === "video" ? "原始视频" : "原始音频",
      type: meta.mediaType === "video" ? "video" : "audio",
      url: meta.sourceMedia,
    } : null)
    || defaultMediaItem(items);
}

function editedPreviewItem() {
  const audio = reviewAudioItem();
  if (audio) return audio;
  const items = meta.media || [];
  return items.find(item => item.id === "draft")
    || items.find(item => item.id === "preview-media")
    || items.find(item => item.id === "source")
    || defaultMediaItem(items);
}

function mediaTagHtml(item, attr) {
  if (!item) return `<div class="empty">当前项目没有可预览媒体</div>`;
  const tag = item.type === "video" ? "video" : "audio";
  return `<${tag} ${attr} controls preload="metadata" src="${escapeHtml(item.url)}"></${tag}>`;
}

function renderMediaTabs() {
  const sourceItem = sourcePreviewItem();
  const editedItem = editedPreviewItem();
  resetWaveform();
  $("sourceMediaMount").innerHTML = mediaTagHtml(sourceItem, "data-source-media");
  $("editedMediaMount").innerHTML = mediaTagHtml(editedItem, "data-edited-media");
  attachEditedSkipPreview();
  attachSourceTimelineEvents();
  renderTimeline();
}

function attachSourceTimelineEvents() {
  const media = document.querySelector("[data-source-media]");
  if (!media) return;
  applyTimelineMediaSettings(media);
  media.addEventListener("timeupdate", () => syncTimelineFromMedia(media));
  media.addEventListener("seeking", () => syncTimelineFromMedia(media));
}

function renderExportResults(result = null) {
  if (!result) {
    $("exportResults").textContent = "还没有导出";
    $("exportPopover").hidden = true;
    return;
  }
  const entries = [
    ["成片 SRT", result.srt],
    ["原始时间线 SRT", result.currentTimelineSrt],
    ["EDL / keep segments", result.edl],
    ["删除区间 CSV", result.deletes],
    ["全文 CSV", result.scriptLines],
    ["DaVinci FCPXML", result.davinciTimelineFcpxml],
    ["DaVinci handoff", result.davinciHandoff],
    ["DaVinci keep CSV", result.davinciKeepCsv],
    ["DaVinci readme", result.davinciReadme],
    ["成片逐字对齐 JSON", result.selectedAlignmentJson],
    ["成片逐字对齐 JSONL", result.selectedAlignmentUnitsJsonl],
    ["成片逐字对齐 CSV", result.selectedAlignmentUnitsCsv],
    ["原始时间线逐字对齐 JSON", result.originalAlignmentJson],
    ["原始时间线逐字对齐 JSONL", result.originalAlignmentUnitsJsonl],
    ["原始时间线逐字对齐 CSV", result.originalAlignmentUnitsCsv],
    ["渲染媒体", result.media || result.audio || result.video],
  ].filter(([, value]) => value);
  $("exportResults").innerHTML = entries.map(([label, value]) =>
    `<div><strong>${escapeHtml(label)}</strong>：${escapeHtml(value)}</div>`
  ).join("");
  $("exportPopover").hidden = false;
}

function visibleLines() {
  const q = $("search").value.trim().toLowerCase();
  return state.scriptLines.filter(line => {
    if (showDeletedOnly && !line.deleted) return false;
    if (!lineMatchesReviewFilter(line)) return false;
    if (!q) return true;
    return reviewItemSearchText(line).includes(q);
  });
}

function lineIdsForTake(take) {
  return Array.isArray(take.lineIds) && take.lineIds.length ? take.lineIds : [take.lineId].filter(Boolean);
}

function linesForTake(take) {
  if (take.takeId) {
    const lines = linesForTakeId(take.takeId);
    if (lines.length) return lines;
  }
  return lineIdsForTake(take).map(id => lineById(id)).filter(Boolean);
}

function takeText(take) {
  const lines = linesForTake(take);
  return lines.length ? lines.map(line => line.text || "").join("") : (take.text || "");
}

function takeDeleted(take) {
  const lines = linesForTake(take);
  return lines.length ? lines.every(line => line.deleted) : Boolean(take.deleted);
}

function visibleCandidateGroups() {
  const q = $("search").value.trim().toLowerCase();
  const groups = state.referenceReview?.groups || [];
  return groups.map(group => ({
    ...group,
    takes: (group.takes || []).filter(take => {
      const lines = linesForTake(take);
      const text = reviewItemSearchText(take, lines, group.referenceText || "");
      if (showDeletedOnly && !takeDeleted(take)) return false;
      if (!reviewItemMatchesFilter(take, qaFilter, lines)) return false;
      return !q || text.includes(q);
    }),
  })).filter(group => group.takes.length);
}

function renderModeControls() {
  const hasReference = Boolean(state.referenceReview?.groups?.length);
  if (!hasReference && reviewMode === "candidates") {
    navMode = "script";
    reviewMode = lastTextMode;
  }
  $("candidateModeBtn").disabled = !hasReference;
  $("candidateModeBtn").classList.toggle("active", reviewMode === "candidates");
  $("scriptNavBtn").classList.toggle("active", navMode === "script");
  $("qaNavBtn").classList.toggle("active", navMode === "qa");
  $("statsNavBtn").classList.toggle("active", reviewMode === "stats");
  $("lineModeBtn").classList.toggle("active", reviewMode === "lines");
  $("continuousModeBtn").classList.toggle("active", reviewMode === "continuous");
  $("finalModeBtn").classList.toggle("active", reviewMode === "final");
  $("showDeleted").classList.toggle("active", showDeletedOnly);
  renderReviewFilters();
}

function renderRows() {
  const rows = visibleLines();
  const editable = canEdit();
  const header = `<div class="line-table-head" aria-hidden="true">
    <span></span>
    <span>#</span>
    <span>文本内容</span>
    <span>提示</span>
  </div>`;
  $("scriptRows").innerHTML = rows.length ? `${header}${rows.map(line => {
    const deleted = Boolean(line.deleted);
    const active = String(line.id) === String(activeLineId);
    const pause = line.lineType === "pause";
    const timeExpanded = String(expandedTimeLineId) === String(line.id);
    const rowClass = ["line-row", deleted ? "deleted" : "", active ? "active" : "", pause ? "pause" : "", timeExpanded ? "time-expanded" : "", reviewClassListForItem(line)].filter(Boolean).join(" ");
    const marker = active ? "▶" : (reviewItemFlags(line).length ? "•" : "");
    return `<div class="${rowClass}" data-line-id="${line.id}">
      <div class="line-play-marker">${marker}</div>

      <div class="line-content">
        <div class="line-text" data-line-text="${line.id}" contenteditable="${editable ? "true" : "false"}" spellcheck="false">${escapeHtml(line.text)}</div>
        <div class="line-time-details">源 ${fmt(line.start)}-${fmt(line.end)} · 成片 ${deleted ? "删除" : `${fmt(sourceToOutputTime(line.start))}-${fmt(sourceToOutputTime(line.end))}`}</div>
      </div>
      <div class="line-status">${lineHintsHtml(line)}</div>
    </div>`;

function renderCandidateGroups() {
  const editable = canEdit();
  const groups = visibleCandidateGroups();
  $("scriptRows").innerHTML = groups.length ? `<div class="candidate-groups">${
    groups.map(group => {
      const refNumber = Number(group.referenceIndex) + 1;
      const takes = group.takes || [];
      const multiTake = takes.length > 1;
      const adoptedCount = takes.filter(take => !takeDeleted(take)).length;
      const deletedCount = takes.length - adoptedCount;
      return `<section class="candidate-group">
        <div class="candidate-head">
          <div class="candidate-meta">参考句 #${refNumber}</div>
          <div class="reference-text">${escapeHtml(group.referenceText || "")}</div>
          <div class="candidate-summary">
            <span>已采用 ${adoptedCount}</span>
            <span>${multiTake ? `备选/已删除候选 ${deletedCount}` : (deletedCount ? "当前候选已删除" : "单候选已采用")}</span>
          </div>
        </div>
        ${takes.map(take => {
          const lines = linesForTake(take);
          const firstLine = lines[0] || null;
          const deleted = takeDeleted(take);
          const takeStatus = deleted ? "备选 / 已删除候选" : "已采用";
          const active = firstLine && String(firstLine.id) === String(activeLineId);
          const flags = reviewFlagsHtml(take, lines);
          const start = firstLine ? Math.min(...lines.map(line => parseNum(line.start))) : parseNum(take.start);
          const end = firstLine ? Math.max(...lines.map(line => parseNum(line.end))) : parseNum(take.end);
          const rowClass = ["take-row", deleted ? "deleted" : "", active ? "active" : "", reviewClassListForItem(take, lines)].filter(Boolean).join(" ");
          return `<div class="${rowClass}" data-take-id="${escapeHtml(take.takeId || "")}" data-line-id="${firstLine?.id || take.lineId || ""}">
            <div class="line-meta">
              <div><span class="line-number">#${escapeHtml(firstLine?.index || take.index || take.lineId || "")}</span></div>
              <div class="time">源 ${fmt(start)}-${fmt(end)}<br>${deleted ? "成片 删除" : `成片 ${fmt(sourceToOutputTime(start))}`}</div>
              <div class="candidate-meta">匹配度 ${(Number(take.matchScore) || 0).toFixed(2)}</div>
            </div>
            <div>
              <div class="candidate-status ${deleted ? "deleted" : "adopted"}">${takeStatus}</div>

            </div>
            <div class="line-actions">

              <button class="small danger" data-toggle-take-delete="${escapeHtml(take.takeId || "")}" ${editable ? "" : "disabled"}>${deleted ? "保留" : "删线"}</button>

          </div>`;
        }).join("")}
      </section>`;
    }).join("")
  }</div>` : `<div class="empty">没有匹配的文案候选；可切回全文行继续审阅</div>`;
}

function reviewFlagsInlineHtml(line) {

function renderContinuous() {
  const rows = visibleLines();
  const editable = canEdit();
  const content = rows.map(line => {
    const deleted = Boolean(line.deleted);
    const active = String(line.id) === String(activeLineId);

function finalLines() {
  const q = $("search").value.trim().toLowerCase();
  return state.scriptLines.filter(line => {
    if (line.deleted) return false;
    return !q || reviewItemSearchText(line).includes(q);
  });
}

function renderFinalView() {
  const rows = finalLines();
  const content = rows.map(line => {
    const active = String(line.id) === String(activeLineId);
    const rowClass = ["final-segment", active ? "active" : ""].filter(Boolean).join(" ");

function renderStatsView() {
