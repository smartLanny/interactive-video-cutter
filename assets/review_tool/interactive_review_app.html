<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交互式全文稿审片</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f6f8;
    --ink: #15171a;
    --muted: #667085;
    --line: #d9dee7;
    --panel: #ffffff;
    --panel-soft: #f9fafb;
    --accent: #0a66c2;
    --danger: #b42318;
    --ok: #087443;
    --soft: #eef2f7;
    --shadow: 0 12px 28px rgba(16, 24, 40, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.5;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: rgba(244, 246, 248, 0.97);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(8px);
  }
  .bar {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 16px;
    align-items: center;
    padding: 13px 20px 10px;
  }
  h1 {
    margin: 0;
    font-size: 20px;
    letter-spacing: 0;
  }
  .sub, .status {
    color: var(--muted);
    font-size: 13px;
  }
  .actions, .tool-buttons, .line-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .view-toggle {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 7px;
    overflow: hidden;
    background: #fff;
  }
  .view-toggle button {
    border: 0;
    border-radius: 0;
    background: transparent;
  }
  .view-toggle button.active {
    background: var(--ink);
    color: #fff;
  }
  .actions { justify-content: flex-end; }
  button, input, select, [contenteditable] {
    font: inherit;
  }
  button {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 10px;
    background: #fff;
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { border-color: #a8b2c2; }
  button:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }
  button.primary {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
  }
  button.danger { color: var(--danger); }
  button[hidden] { display: none; }
  button.active {
    border-color: var(--ink);
    background: var(--ink);
    color: #fff;
  }
  .status {
    min-height: 24px;
    padding: 0 18px 10px;
  }
  .status.ok { color: var(--ok); }
  .status.danger-text { color: var(--danger); }
  .project-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-top: 8px;
  }
  .lock-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-top: 6px;
  }
  .lock-status {
    color: var(--muted);
    font-size: 13px;
  }
  .lock-status.locked {
    color: var(--danger);
  }
  .lock-status.held {
    color: var(--ok);
  }
  select {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 8px;
    background: #fff;
    min-width: 220px;
  }
  .review-column {
    min-width: 0;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    min-height: 0;
  }
  .preview-column {
    min-width: 0;
    position: sticky;
    top: 142px;
    align-self: start;
    max-height: calc(100vh - 160px);
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .players {
    display: grid;
    gap: 12px;
  }
  .preview-pair {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  .player {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    padding: 12px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
  }
  .player label {
    display: block;
    margin-bottom: 8px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 650;
  }
  .preview-note {
    min-height: 20px;
    margin-top: 6px;
    color: var(--muted);
    font-size: 12px;
  }
  .media-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 8px;
  }
  .media-tabs button.active {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
  }
  audio, video { width: 100%; display: block; background: #000; }
  video { max-height: min(300px, 34vh); }
  .export-panel {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    padding: 12px;
    font-size: 13px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
  }
  .export-panel h2 {
    margin: 0 0 8px;
    font-size: 14px;
    letter-spacing: 0;
  }
  .export-list {
    display: grid;
    gap: 5px;
    max-height: min(280px, 32vh);
    overflow-y: auto;
    padding-right: 4px;
  }
  .export-list div {
    overflow-wrap: anywhere;
  }
  .metrics {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 18px;
    background: #fff;
    border-bottom: 1px solid var(--line);
  }
  .metric {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 9px;
    background: #fff;
    font-size: 13px;
  }
  .metric span { color: var(--muted); margin-right: 4px; }
  main.review-layout {
    display: grid;
    grid-template-columns: minmax(680px, 1fr) minmax(340px, 420px);
    gap: 16px;
    min-height: calc(100vh - 142px);
    padding: 16px 20px 20px;
    align-items: start;
  }
  .toolbar {
    display: grid;
    grid-template-columns: minmax(240px, 1fr) auto auto;
    gap: 12px;
    align-items: center;
    position: sticky;
    top: 142px;
    z-index: 3;
    margin-bottom: 10px;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.96);
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    backdrop-filter: blur(8px);
  }
  .filter-info {
    color: var(--muted);
    font-size: 13px;
    white-space: nowrap;
  }
  .review-filters {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-width: 0;
  }
  .review-filters button {
    padding: 5px 8px;
    font-size: 12px;
  }
  .review-filters .filter-count {
    margin-left: 4px;
    color: inherit;
    opacity: 0.72;
    font-variant-numeric: tabular-nums;
  }
  .toolbar .tool-buttons {
    grid-column: 1 / -1;
    justify-content: flex-start;
  }
  .bulk-menu {
    position: relative;
  }
  .bulk-menu summary {
    list-style: none;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 10px;
    background: #fff;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .bulk-menu summary::-webkit-details-marker {
    display: none;
  }
  .bulk-menu[open] summary {
    border-color: #a8b2c2;
  }
  .bulk-panel {
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    z-index: 8;
    display: grid;
    gap: 6px;
    min-width: 150px;
    padding: 8px;
    border: 1px solid var(--line);
    background: #fff;
    box-shadow: 0 10px 20px rgba(15, 23, 42, 0.10);
  }
  .bulk-panel button {
    width: 100%;
    text-align: left;
  }
  input[type="search"] {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 9px 10px;
    background: #fff;
  }
  .script {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    overflow-y: auto;
    min-height: 0;
    max-height: calc(100vh - 214px);
    box-shadow: var(--shadow);
  }
  .line-row {
    display: grid;
    grid-template-columns: 124px minmax(0, 1fr) auto;
    gap: 12px;
    align-items: start;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  .line-row:last-child { border-bottom: 0; }
  .line-row.active {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
    background: #f8fbff;
  }
  .line-row.deleted {
    background: var(--panel-soft);
  }
  .line-row.deleted .line-text {
    text-decoration: line-through;
    color: #7a3030;
  }
  .line-row.review-focus,
  .take-row.review-focus {
    border-left: 4px solid #d92d20;
    background: #fff7f5;
  }
  .line-row.review-asr:not(.review-focus),
  .take-row.review-asr:not(.review-focus) {
    border-left: 4px solid #b54708;
    background: #fff8eb;
  }
  .line-row.review-metric:not(.review-focus):not(.review-asr),
  .take-row.review-metric:not(.review-focus):not(.review-asr) {
    border-left: 4px solid #1570ef;
    background: #f5faff;
  }
  .line-row.review-term:not(.review-focus):not(.review-asr):not(.review-metric),
  .take-row.review-term:not(.review-focus):not(.review-asr):not(.review-metric) {
    border-left: 4px solid #7a2e83;
    background: #fbf7ff;
  }
  .line-row.review-delete-suggestion:not(.review-focus):not(.review-asr):not(.review-metric):not(.review-term),
  .take-row.review-delete-suggestion:not(.review-focus):not(.review-asr):not(.review-metric):not(.review-term) {
    border-left: 4px solid #b42318;
    background: #fffafa;
  }
  .line-row.pause .line-text {
    color: var(--muted);
    font-style: italic;
  }
  .candidate-groups {
    display: grid;
    gap: 12px;
    padding: 12px;
  }
  .candidate-group {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    overflow: hidden;
  }
  .candidate-head {
    display: grid;
    gap: 5px;
    padding: 10px 12px;
    background: var(--panel-soft);
    border-bottom: 1px solid var(--line);
  }
  .reference-text {
    font-size: 15px;
    line-height: 1.65;
  }
  .candidate-meta {
    color: var(--muted);
    font-size: 12px;
  }
  .qa-flags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 6px;
    font-size: 12px;
  }
  .qa-chip {
    display: inline-flex;
    align-items: center;
    max-width: 100%;
    min-height: 24px;
    border: 1px solid transparent;
    border-radius: 5px;
    padding: 2px 6px;
    font-size: 12px;
    font-weight: 650;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }
  button.qa-chip {
    white-space: normal;
    cursor: pointer;
  }
  .qa-chip.flag-human {
    border-color: #fecdca;
    background: #fff1f0;
    color: #b42318;
  }
  .qa-chip.flag-review {
    border-color: #fecdd3;
    background: #fff1f3;
    color: #be123c;
  }
  .qa-chip.flag-polish {
    border-color: #c7d7fe;
    background: #eef4ff;
    color: #3538cd;
  }
  .qa-chip.flag-asr {
    border-color: #fedf89;
    background: #fffaeb;
    color: #b54708;
  }
  .qa-chip.flag-metric {
    border-color: #b2ddff;
    background: #eff8ff;
    color: #175cd3;
  }
  .qa-chip.flag-term-protected {
    border-color: #d9b8ff;
    background: #f7efff;
    color: #7a2e83;
  }
  .qa-chip.flag-term-reference {
    border-color: #99f6e4;
    background: #f0fdfa;
    color: #0f766e;
  }
  .qa-chip.flag-delete {
    border-color: #fda29b;
    background: #fff4f3;
    color: #b42318;
  }
  .qa-chip.flag-neutral {
    border-color: #d0d5dd;
    background: #f9fafb;
    color: #475467;
  }
  .take-row {
    display: grid;
    grid-template-columns: 118px minmax(0, 1fr) auto;
    gap: 12px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  .take-row:last-child { border-bottom: 0; }
  .take-row.deleted {
    background: var(--panel-soft);
  }
  .take-row.active {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
    background: #f8fbff;
  }
  .take-row.deleted .take-text {
    text-decoration: line-through;
    color: #7a3030;
  }
  .take-text {
    font-size: 15px;
    line-height: 1.65;
    overflow-wrap: anywhere;
  }
  .line-meta {
    display: grid;
    gap: 5px;
    color: var(--muted);
    font-size: 12px;
  }
  .line-number {
    color: var(--ink);
    font-weight: 650;
  }
  .time {
    font-variant-numeric: tabular-nums;
  }
  .line-text {
    min-height: 34px;
    padding: 6px 7px;
    border-radius: 5px;
    outline: 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: 16px;
    line-height: 1.7;
  }
  .line-text:focus {
    background: #fff;
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .line-actions {
    justify-content: flex-end;
    min-width: 92px;
  }
  .small {
    padding: 5px 7px;
    font-size: 12px;
  }
  .empty {
    padding: 18px;
    color: var(--muted);
  }
  @media (max-width: 980px) {
    .bar, main.review-layout, .preview-pair, .toolbar, .line-row, .take-row {
      grid-template-columns: 1fr;
    }
    main.review-layout {
      min-height: auto;
    }
    .preview-column, .toolbar {
      position: static;
      max-height: none;
    }
    .preview-column {
      order: -1;
    }
    .script {
      max-height: 62vh;
      overflow-y: auto;
    }
    .filter-info { white-space: normal; }
    .review-filters, .toolbar .tool-buttons { grid-column: auto; }
    .actions, .line-actions { justify-content: flex-start; }
    .bulk-panel {
      position: static;
      margin-top: 6px;
      box-shadow: none;
    }
  }
</style>

<header>
  <div class="bar">
    <div>
      <h1 id="pageTitle">交互式全文稿审片</h1>
      <div class="sub">一行一句；删除线行会被剪掉，取消删除线就保留。↑/↓ 切换审阅行；⌘P/Ctrl+P 播放当前行；←/→ 移动文字光标；Enter 拆行；行首 Backspace 合并上行；⌘J/Ctrl+J 合并下行；空行 Delete 转删除线；选中文字后 ⌘D/Ctrl+D 自动切分并给选区划删除线。</div>
      <div class="project-row">
        <label for="projectSelect" class="sub">项目</label>
        <select id="projectSelect"></select>
        <span class="sub" id="projectInfo"></span>
      </div>
      <div class="lock-row">
        <span id="lockInfo" class="lock-status">编辑锁检查中</span>
        <button id="acquireLockBtn" class="small" hidden>获取编辑权</button>
        <button id="takeoverLockBtn" class="small danger" hidden>接管编辑</button>
        <button id="releaseLockBtn" class="small" hidden>释放编辑权</button>
      </div>
    </div>
    <div class="actions">
      <button id="saveBtn" class="primary">保存</button>
      <button id="forceSaveBtn" class="danger" hidden>强制覆盖保存</button>
      <button id="exportBtn">导出文件</button>
      <button id="renderBtn">渲染预览</button>
      <button id="reloadBtn" class="danger">重载状态</button>
    </div>
  </div>
  <div class="status" id="status">载入中</div>
  <section class="metrics" id="metrics"></section>
</header>

<main class="review-layout">
  <section class="review-column">
    <div class="toolbar">
      <input id="search" type="search" placeholder="搜索全文、flag、中文风险标签、删点来源">
      <div class="view-toggle" aria-label="审阅模式">
        <button id="candidateModeBtn" type="button">文案候选</button>
        <button id="lineModeBtn" type="button" class="active">全文行</button>
      </div>
      <div class="filter-info" id="filterInfo"></div>
      <div class="review-filters" id="reviewFilters" aria-label="待审重点过滤"></div>
      <div class="tool-buttons">
        <button id="showDeleted">只看删除线</button>
        <button id="prevDeleted">上一条删除线</button>
        <button id="nextDeleted">下一条删除线</button>
        <details class="bulk-menu">
          <summary>批量</summary>
          <div class="bulk-panel">
            <button id="restoreSuggested">恢复建议删除线</button>
            <button id="clearDeleted">取消全部删除线</button>
          </div>
        </details>
      </div>
    </div>
    <section class="script" id="scriptRows"></section>
  </section>
  <aside class="preview-column">
    <section class="players">
      <div class="preview-pair">
        <div class="player">
          <label>原始音频</label>
          <div id="sourceMediaMount"></div>
          <div class="preview-note">播放原始素材时间线</div>
        </div>
        <div class="player">
          <label>删线音频</label>
          <div id="editedMediaMount"></div>
          <div class="preview-note" id="editedPreviewInfo">实时跳过删除线区间</div>
        </div>
      </div>
      <div class="export-panel">
        <h2>最近导出</h2>
        <div class="export-list" id="exportResults">还没有导出</div>
      </div>
    </section>
  </aside>
</main>

<script>
const $ = (id) => document.getElementById(id);
const VISIBLE_PUNCT_RE = /[，,、；;：:。！？!?]/g;
const DECIMAL_DOT_TOKEN = "__DECIMAL_DOT__";
const fmt = (s) => {
  s = Math.max(0, Number(s) || 0);
  const m = Math.floor(s / 60);
  const sec = (s - m * 60).toFixed(2).padStart(5, "0");
  return `${String(m).padStart(2, "0")}:${sec}`;
};
const parseNum = (value) => Number.parseFloat(String(value).trim()) || 0;

let projects = [];
let currentProjectId = "";
let meta = {};
let state = { scriptLines: [], useScriptLines: true };
let activeLineId = null;
let showDeletedOnly = false;
let baseRevision = null;
let dirty = false;
let saveConflict = null;
let stopHandler = null;
let stopMedia = null;
let stopPollTimer = null;
let editedSkipHandler = null;
let busyMode = "";
let lockToken = "";
let lockStatus = { locked: false, heldByMe: false };
let heartbeatTimer = null;
let reviewMode = "lines";
let qaFilter = "all";
let undoStack = [];
let redoStack = [];
let pendingTextSnapshot = false;
let textHistoryTimer = null;
const MAX_HISTORY = 80;
const REVIEW_FILTERS = [
  { id: "all", label: "全部" },
  { id: "focus", label: "重点" },
  { id: "asr-gap", label: "ASR空窗" },
  { id: "dense-metric", label: "密集数字" },
  { id: "term-risk", label: "术语风险" },
  { id: "delete-suggested", label: "删除建议" },
];
const QA_FLAG_DEFS = [
  { keys: ["needs_human", "needs-human"], label: "人工复核", css: "flag-human", category: "focus", filter: "focus", priority: true, search: ["重点", "待审重点", "人审", "人工确认"] },
  { keys: ["needs-review", "needs_review"], label: "待审重点", css: "flag-review", category: "focus", filter: "focus", priority: true, search: ["复核", "重点审查", "人工听"] },
  { keys: ["ai-polish-focus"], label: "AI打磨重点", css: "flag-polish", category: "focus", filter: "focus", priority: true, search: ["AI polish", "重点打磨", "改稿重点"] },
  { keys: ["asr-timestamp-gap"], label: "ASR空窗", css: "flag-asr", category: "asr-gap", filter: "asr-gap", priority: true, search: ["时间戳空窗", "空窗", "断点", "长停顿"] },
  { keys: ["targeted-quality-asr-fix"], label: "定向ASR修正", css: "flag-asr", category: "focus", filter: "focus", priority: true, search: ["ASR修正", "定向复听", "质量ASR"] },
  { keys: ["dense-metric-review"], label: "密集数字", css: "flag-metric", category: "dense-metric", filter: "dense-metric", priority: false, search: ["数字风险", "参数密集", "跑分", "规格"] },
  { keys: ["long-window-review"], label: "长窗口", css: "flag-metric", category: "dense-metric", filter: "dense-metric", priority: false, search: ["长句", "长时间段", "断句风险"] },
  { keys: ["protected-term-review"], label: "保护术语", css: "flag-term-protected", category: "term-risk", filter: "term-risk", priority: false, search: ["术语风险", "保护词", "专名", "型号"] },
  { keys: ["term-not-in-reference"], label: "参考外术语", css: "flag-term-reference", category: "term-risk", filter: "term-risk", priority: false, search: ["术语风险", "参考未出现", "参考外", "专名"] },
  { keys: ["off-reference"], label: "参考外口播", css: "flag-neutral", category: "", filter: "", priority: false, search: ["参考外", "非文案", "off reference"] },
  { keys: ["suggested-delete", "delete-suggestion", "ai-polish-delete", "pause", "superseded-take"], label: "删除建议", css: "flag-delete", category: "delete-suggested", filter: "delete-suggested", priority: false, search: ["删点", "建议删除", "删除线", "AI删除", "停顿", "旧take"] },
];
const REVIEW_ROW_CLASSES = ["review-focus", "review-asr", "review-metric", "review-term", "review-delete-suggestion"];

function makeId(prefix) {
  const value = globalThis.crypto?.randomUUID ? globalThis.crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
  return `${prefix}-${value}`;
}

const clientId = (() => {
  const key = "interactiveReviewClientId";
  let value = localStorage.getItem(key);
  if (!value) {
    value = makeId("client");
    localStorage.setItem(key, value);
  }
  return value;
})();

const tabId = (() => {
  const key = "interactiveReviewTabId";
  let value = sessionStorage.getItem(key);
  if (!value) {
    value = makeId("tab");
    sessionStorage.setItem(key, value);
  }
  return value;
})();

function ownerName() {
  return `浏览器 ${clientId.slice(-6)}`;
}

function lockStorageKey(projectId = currentProjectId) {
  return `interactiveReviewLockToken:${projectId}`;
}

function canEdit() {
  return Boolean(lockStatus?.heldByMe && lockToken);
}

function requireEdit() {
  if (canEdit()) return true;
  setStatus("当前是只读状态，需要先获取或接管编辑权。", "danger-text");
  return false;
}

function setStatus(text, cls = "") {
  const el = $("status");
  el.className = `status ${cls}`;
  el.textContent = text;
}

function setBusy(mode = "") {
  busyMode = mode;
  renderControls();
}

function renderLockInfo() {
  const info = $("lockInfo");
  const lock = lockStatus?.lock;
  info.className = "lock-status";
  if (canEdit()) {
    info.textContent = `已取得编辑权：${lock?.ownerName || ownerName()}`;
    info.classList.add("held");
  } else if (lockStatus?.locked) {
    info.textContent = `只读：${lock?.ownerName || "其他浏览器"} 正在编辑`;
    info.classList.add("locked");
  } else {
    info.textContent = "未取得编辑权";
  }
  $("acquireLockBtn").hidden = canEdit() || Boolean(lockStatus?.locked);
  $("takeoverLockBtn").hidden = canEdit() || !lockStatus?.locked;
  $("releaseLockBtn").hidden = !canEdit();
}

function renderControls() {
  const busy = Boolean(busyMode);
  const readOnly = !canEdit();
  $("saveBtn").disabled = busy || readOnly;
  $("exportBtn").disabled = busy || readOnly;
  $("renderBtn").disabled = busy || readOnly;
  $("forceSaveBtn").disabled = busy || readOnly;
  $("restoreSuggested").disabled = busy || readOnly;
  $("clearDeleted").disabled = busy || readOnly;
  $("reloadBtn").disabled = busy;
  $("projectSelect").disabled = busy;
  $("saveBtn").textContent = busyMode === "saving" ? "保存中" : "保存";
  $("exportBtn").textContent = busyMode === "exporting" ? "导出中" : "导出文件";
  $("renderBtn").textContent = busyMode === "rendering" ? "渲染中" : "渲染预览";
  renderLockInfo();
}

function escapeHtml(text) {
  return String(text ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}

function normalizeFlagKey(flag) {
  return String(flag || "").trim().toLowerCase();
}

function flagDefFor(flag) {
  const key = normalizeFlagKey(flag);
  const dashed = key.replace(/_/g, "-");
  return QA_FLAG_DEFS.find(def => def.keys.includes(key) || def.keys.includes(dashed)) || null;
}

function inferredFlagCategory(flag) {
  const key = normalizeFlagKey(flag).replace(/_/g, "-");
  if (key.includes("timestamp-gap") || key.includes("asr-gap")) return "asr-gap";
  if (key.includes("metric") || key.includes("dense")) return "dense-metric";
  if (key.includes("term")) return "term-risk";
  if (key.includes("delete")) return "delete-suggested";
  if (key.includes("needs") || key.includes("review") || key.includes("focus")) return "focus";
  return "";
}

function flagCategory(flag) {
  return flagDefFor(flag)?.category || inferredFlagCategory(flag);
}

function flagFilterId(flag) {
  const def = flagDefFor(flag);
  if (def?.filter) return def.filter;
  return flagCategory(flag) || "";
}

function flagLabel(flag) {
  return flagDefFor(flag)?.label || String(flag || "").trim();
}

function flagCssClass(flag) {
  const def = flagDefFor(flag);
  if (def?.css) return def.css;
  const category = flagCategory(flag);
  if (category === "asr-gap") return "flag-asr";
  if (category === "dense-metric") return "flag-metric";
  if (category === "term-risk") return "flag-term-protected";
  if (category === "delete-suggested") return "flag-delete";
  if (category === "focus") return "flag-review";
  return "flag-neutral";
}

function uniquePush(list, seen, value) {
  const text = String(value || "").trim();
  if (!text) return;
  const key = normalizeFlagKey(text);
  if (seen.has(key)) return;
  seen.add(key);
  list.push(text);
}

function isReviewItemSuggestedDelete(item, relatedLines = []) {
  return Boolean((item && isSuggestedDeleteLine(item)) || relatedLines.some(line => line && isSuggestedDeleteLine(line)));
}

function reviewItemFlags(item, relatedLines = []) {
  const flags = [];
  const seen = new Set();
  [item, ...relatedLines].forEach(source => {
    (Array.isArray(source?.qaFlags) ? source.qaFlags : []).forEach(flag => uniquePush(flags, seen, flag));
  });
  if (isReviewItemSuggestedDelete(item, relatedLines)) uniquePush(flags, seen, "suggested-delete");
  return flags;
}

function hasPriorityFlag(item, relatedLines = []) {
  return reviewItemFlags(item, relatedLines).some(flag => {
    const def = flagDefFor(flag);
    return Boolean(def?.priority || flagCategory(flag) === "focus");
  });
}

function reviewItemMatchesFilter(item, filterId, relatedLines = []) {
  if (!filterId || filterId === "all") return true;
  if (filterId === "focus") return hasPriorityFlag(item, relatedLines);
  if (filterId === "delete-suggested") {
    return isReviewItemSuggestedDelete(item, relatedLines)
      || reviewItemFlags(item, relatedLines).some(flag => flagCategory(flag) === "delete-suggested");
  }
  return reviewItemFlags(item, relatedLines).some(flag => flagCategory(flag) === filterId);
}

function lineMatchesReviewFilter(line, filterId = qaFilter) {
  return reviewItemMatchesFilter(line, filterId);
}

function activeReviewFilterLabel() {
  return REVIEW_FILTERS.find(item => item.id === qaFilter)?.label || "全部";
}

function reviewFilterCounts() {
  return Object.fromEntries(REVIEW_FILTERS.map(filter => [
    filter.id,
    filter.id === "all"
      ? state.scriptLines.length
      : state.scriptLines.filter(line => lineMatchesReviewFilter(line, filter.id)).length,
  ]));
}

function renderReviewFilters() {
  const mount = $("reviewFilters");
  if (!mount) return;
  const counts = reviewFilterCounts();
  mount.innerHTML = REVIEW_FILTERS.map(filter => {
    const active = qaFilter === filter.id;
    return `<button type="button" class="small ${active ? "active" : ""}" data-review-filter="${escapeHtml(filter.id)}" aria-pressed="${active ? "true" : "false"}">${escapeHtml(filter.label)}<span class="filter-count">${counts[filter.id] || 0}</span></button>`;
  }).join("");
}

function flagSearchTerms(flag) {
  const def = flagDefFor(flag);
  const raw = String(flag || "").trim();
  return [
    raw,
    raw.replace(/[-_]/g, " "),
    flagLabel(raw),
    ...(def?.search || []),
  ].filter(Boolean);
}

function reviewItemSearchText(item, relatedLines = [], extraText = "") {
  const lineText = relatedLines.map(line => `${line.text || ""} ${line.source || ""}`).join(" ");
  const flagText = reviewItemFlags(item, relatedLines).flatMap(flag => flagSearchTerms(flag)).join(" ");
  return `${extraText || ""} ${item?.text || ""} ${item?.source || ""} ${lineText} ${flagText}`.toLowerCase();
}

function reviewFlagsHtml(item, relatedLines = []) {
  const flags = reviewItemFlags(item, relatedLines);
  if (!flags.length) return "";
  const chips = flags.map(flag => {
    const raw = String(flag || "").trim();
    const label = flagLabel(raw);
    const filter = flagFilterId(raw);
    const title = label === raw ? raw : `${label} (${raw})`;
    const attrs = filter ? ` type="button" data-review-filter="${escapeHtml(filter)}"` : "";
    const tag = filter ? "button" : "span";
    return `<${tag}${attrs} class="qa-chip ${escapeHtml(flagCssClass(raw))}" title="${escapeHtml(title)}">${escapeHtml(label)}</${tag}>`;
  }).join("");
  return `<div class="qa-flags" aria-label="待审重点">${chips}</div>`;
}

function reviewClassListForItem(item, relatedLines = []) {
  return [
    reviewItemMatchesFilter(item, "focus", relatedLines) ? "review-focus" : "",
    reviewItemMatchesFilter(item, "asr-gap", relatedLines) ? "review-asr" : "",
    reviewItemMatchesFilter(item, "dense-metric", relatedLines) ? "review-metric" : "",
    reviewItemMatchesFilter(item, "term-risk", relatedLines) ? "review-term" : "",
    reviewItemMatchesFilter(item, "delete-suggested", relatedLines) ? "review-delete-suggestion" : "",
  ].filter(Boolean).join(" ");
}

function applyReviewRowClasses(row, item, relatedLines = []) {
  row.classList.remove(...REVIEW_ROW_CLASSES);
  reviewClassListForItem(item, relatedLines).split(" ").filter(Boolean).forEach(cls => row.classList.add(cls));
}

function cleanReviewText(text) {
  return String(text || "")
    .replace(/\s+/g, " ")
    .replace(/(\d)\.(\d)/g, `$1${DECIMAL_DOT_TOKEN}$2`)
    .replace(/([A-Za-z0-9%])\s*[，,、；;：:。！？!?]\s*(?=[A-Za-z0-9])/g, "$1 ")
    .replace(VISIBLE_PUNCT_RE, "")
    .replace(/\./g, "")
    .replaceAll(DECIMAL_DOT_TOKEN, ".")
    .replace(/\s+/g, " ")
    .trim();
}

function shortRevision(value) {
  return value ? String(value).slice(0, 22) : "无";
}

function projectLabel(project) {
  const type = project.mediaType === "video" ? "视频" : "音频";
  return `${project.title} (${type})`;
}

function apiPath(path) {
  return `${path}?project=${encodeURIComponent(currentProjectId)}`;
}

function apiPathWithLock(path) {
  const query = new URLSearchParams({
    project: currentProjectId,
    ownerId: clientId,
    lockToken: lockToken || "",
  });
  return `${path}?${query.toString()}`;
}

function lockPayload(extra = {}) {
  return {
    ownerId: clientId,
    ownerName: ownerName(),
    tabId,
    lockToken,
    ...extra,
  };
}

function applyLockStatus(nextStatus = {}) {
  lockStatus = nextStatus || { locked: false, heldByMe: false };
  if (lockStatus.heldByMe && lockStatus.lock?.token) {
    lockToken = lockStatus.lock.token;
    localStorage.setItem(lockStorageKey(), lockToken);
  } else if (!lockStatus.heldByMe) {
    lockToken = "";
    localStorage.removeItem(lockStorageKey());
  }
  renderControls();
  renderAll();
}

function stopHeartbeat() {
  if (heartbeatTimer) clearInterval(heartbeatTimer);
  heartbeatTimer = null;
}

function startHeartbeat() {
  stopHeartbeat();
  if (!canEdit()) return;
  heartbeatTimer = setInterval(() => heartbeatLock(), 20000);
}

async function acquireLock(takeover = false) {
  if (!currentProjectId) return false;
  const endpoint = takeover ? "/api/lock/takeover" : "/api/lock/acquire";
  const res = await fetch(apiPath(endpoint), {
    method: "POST",
    body: JSON.stringify(lockPayload(takeover ? { reason: "manual takeover" } : {})),
  });
  const data = await res.json();
  if (!res.ok || data.ok === false) {
    applyLockStatus({ locked: Boolean(data.locked), heldByMe: false, lock: data.lock });
    setStatus(data.locked ? `只读：${data.lock?.ownerName || "其他浏览器"} 正在编辑` : `获取编辑权失败：${data.error}`, "danger-text");
    return false;
  }
  lockToken = data.token || data.lock?.token || lockToken;
  localStorage.setItem(lockStorageKey(), lockToken);
  applyLockStatus({ locked: true, heldByMe: true, lock: data.lock });
  startHeartbeat();
  setStatus(takeover ? "已接管编辑权" : "已取得编辑权", "ok");
  return true;
}

async function heartbeatLock() {
  if (!canEdit()) return;
  try {
    const res = await fetch(apiPath("/api/lock/heartbeat"), {
      method: "POST",
      body: JSON.stringify(lockPayload()),
    });
    const data = await res.json();
    if (!res.ok || data.ok === false) {
      stopHeartbeat();
      applyLockStatus({ locked: Boolean(data.locked), heldByMe: false, lock: data.lock });
      setStatus("编辑锁已失效，页面切换为只读。", "danger-text");
      return;
    }
    applyLockStatus({ locked: true, heldByMe: true, lock: data.lock });
  } catch {
    // 下一次 heartbeat 再判断，避免短暂网络抖动立即踢出编辑态。
  }
}

async function releaseLock(options = {}) {
  const projectId = options.projectId || currentProjectId;
  const token = options.token || lockToken || localStorage.getItem(lockStorageKey(projectId)) || "";
  if (!projectId || !token) return;
  stopHeartbeat();
  try {
    await fetch(`/api/lock/release?project=${encodeURIComponent(projectId)}`, {
      method: "POST",
      keepalive: true,
      body: JSON.stringify({
        ownerId: clientId,
        ownerName: ownerName(),
        tabId,
        lockToken: token,
      }),
    });
  } catch {
    // release 是 best-effort；TTL 会自动过期。
  }
  if (projectId === currentProjectId) {
    lockToken = "";
    applyLockStatus({ locked: false, heldByMe: false });
  }
  localStorage.removeItem(lockStorageKey(projectId));
}

function setDirty(value = true) {
  dirty = value;
  renderProjectInfo();
  renderMetrics();
}

function cloneValue(value) {
  return JSON.parse(JSON.stringify(value ?? null));
}

function historySnapshot() {
  return {
    scriptLines: cloneValue(state.scriptLines || []),
    referenceReview: cloneValue(state.referenceReview || null),
    activeLineId,
    showDeletedOnly,
    reviewMode,
    dirty,
  };
}

function historyKey(snapshot) {
  return JSON.stringify({
    scriptLines: snapshot.scriptLines,
    referenceReview: snapshot.referenceReview,
    activeLineId: snapshot.activeLineId,
    showDeletedOnly: snapshot.showDeletedOnly,
    reviewMode: snapshot.reviewMode,
  });
}

function clearHistory() {
  undoStack = [];
  redoStack = [];
  pendingTextSnapshot = false;
  if (textHistoryTimer) clearTimeout(textHistoryTimer);
  textHistoryTimer = null;
}

function pushUndoSnapshot(label = "edit") {
  if (!canEdit()) return false;
  const snapshot = historySnapshot();
  const key = historyKey(snapshot);
  if (undoStack.length && undoStack[undoStack.length - 1].key === key) return false;
  undoStack.push({ key, snapshot, label });
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack = [];
  return true;
}

function beginTextHistory() {
  if (!canEdit() || pendingTextSnapshot) return;
  pushUndoSnapshot("text");
  pendingTextSnapshot = true;
  if (textHistoryTimer) clearTimeout(textHistoryTimer);
  textHistoryTimer = setTimeout(() => {
    pendingTextSnapshot = false;
    textHistoryTimer = null;
  }, 700);
}

function restoreSnapshot(snapshot) {
  state.scriptLines = cloneValue(snapshot.scriptLines || []);
  state.referenceReview = cloneValue(snapshot.referenceReview || null);
  activeLineId = snapshot.activeLineId;
  showDeletedOnly = Boolean(snapshot.showDeletedOnly);
  reviewMode = snapshot.reviewMode || "lines";
  dirty = true;
  renumberLines();
  renderAll();
  requestAnimationFrame(() => {
    if (activeLineId) scrollActiveIntoView();
  });
}

function undoEdit() {
  if (!requireEdit()) return;
  pendingTextSnapshot = false;
  if (textHistoryTimer) clearTimeout(textHistoryTimer);
  textHistoryTimer = null;
  if (!undoStack.length) {
    setStatus("没有可撤回内容", "danger-text");
    return;
  }
  redoStack.push({ key: historyKey(historySnapshot()), snapshot: historySnapshot(), label: "redo" });
  const entry = undoStack.pop();
  restoreSnapshot(entry.snapshot);
  setStatus("已撤回", "ok");
}

function redoEdit() {
  if (!requireEdit()) return;
  pendingTextSnapshot = false;
  if (textHistoryTimer) clearTimeout(textHistoryTimer);
  textHistoryTimer = null;
  if (!redoStack.length) {
    setStatus("没有可重做内容", "danger-text");
    return;
  }
  undoStack.push({ key: historyKey(historySnapshot()), snapshot: historySnapshot(), label: "undo" });
  const entry = redoStack.pop();
  restoreSnapshot(entry.snapshot);
  setStatus("已重做", "ok");
}

function renderProjectInfo() {
  const project = projects.find(item => item.id === currentProjectId);
  const dirtyText = dirty ? "未保存" : "已保存";
  const conflictText = saveConflict ? "；有保存冲突" : "";
  $("projectInfo").textContent = project
    ? `${project.mediaType === "video" ? "视频" : "音频"}；${dirtyText}；版本 ${shortRevision(baseRevision)}${conflictText}`
    : "";
  $("forceSaveBtn").hidden = !saveConflict;
  renderControls();
}

async function loadProjects() {
  const res = await fetch("/api/projects");
  const data = await res.json();
  projects = data.projects || [];
  currentProjectId = data.defaultProject || projects[0]?.id || "";
  $("projectSelect").innerHTML = projects.map(project =>
    `<option value="${escapeHtml(project.id)}">${escapeHtml(projectLabel(project))}</option>`
  ).join("");
  $("projectSelect").value = currentProjectId;
  await loadData(currentProjectId, { force: true });
}

async function loadData(projectId = currentProjectId, options = {}) {
  if (dirty && !options.force && !confirm("当前页面有未保存改动，切换或重载会丢失这些改动。继续？")) {
    $("projectSelect").value = currentProjectId;
    return;
  }
  const previousProjectId = currentProjectId;
  const previousToken = lockToken;
  if (previousProjectId && previousProjectId !== projectId) {
    await releaseLock({ projectId: previousProjectId, token: previousToken });
  }
  currentProjectId = projectId;
  $("projectSelect").value = currentProjectId;
  lockToken = localStorage.getItem(lockStorageKey()) || "";
  const res = await fetch(apiPathWithLock("/api/data"));
  const data = await res.json();
  if (!res.ok || data.ok === false) throw new Error(data.error || "载入失败");
  meta = data.meta;
  state = data.state;
  baseRevision = data.revision || meta.stateRevision || null;
  dirty = false;
  saveConflict = null;
  clearHistory();
  applyLockStatus(data.lockStatus || { locked: false, heldByMe: false });
  state.useScriptLines = true;
  if (!Array.isArray(state.scriptLines)) state.scriptLines = [];
  if (!state.referenceReview) state.referenceReview = null;
  $("pageTitle").textContent = meta.title || "交互式全文稿审片";
  document.title = meta.title || "交互式全文稿审片";
  renumberLines();
  renderAll();
  renderMediaTabs();
  setStatus(`已载入：${meta.statePath}`);
  await acquireLock(false);
}

function lineDuration(line) {
  const start = parseNum(line.start);
  const end = Math.max(start, parseNum(line.end));
  return end - start;
}

function deletedDuration() {
  return state.scriptLines.reduce((sum, line) => sum + (line.deleted ? lineDuration(line) : 0), 0);
}

function renderMetrics() {
  const deletedLines = state.scriptLines.filter(line => line.deleted).length;
  const referenceGroups = state.referenceReview?.groups?.length || 0;
  const removed = deletedDuration();
  const visibleCount = visibleLines().length;
  const filterActive = Boolean($("search")?.value.trim()) || showDeletedOnly || qaFilter !== "all";
  const reviewCounts = reviewFilterCounts();
  $("metrics").innerHTML = [
    `<div class="metric"><span>项目</span>${escapeHtml(meta.title || currentProjectId)}</div>`,
    `<div class="metric"><span>全文行数</span>${state.scriptLines.length}</div>`,
    referenceGroups ? `<div class="metric"><span>文案组</span>${referenceGroups}</div>` : "",
    `<div class="metric"><span>待审重点</span>${reviewCounts.focus || 0}</div>`,
    `<div class="metric"><span>删除线</span>${deletedLines}</div>`,
    `<div class="metric"><span>删除时长</span>${fmt(removed)}</div>`,
    `<div class="metric"><span>预计成片</span>${fmt(meta.originalDuration - removed)}</div>`,
    filterActive ? `<div class="metric"><span>当前可见</span>${visibleCount}</div>` : "",
    activeLineId ? `<div class="metric"><span>当前行</span>#${escapeHtml(lineById(activeLineId)?.index || activeLineId)}</div>` : "",
    `<div class="metric"><span>状态</span>${dirty ? "未保存" : "已保存"}</div>`,
    `<div class="metric"><span>保存路径</span>${escapeHtml(meta.statePath || "")}</div>`
  ].filter(Boolean).join("");
  $("filterInfo").textContent = filterActive
    ? `显示 ${visibleCount} / ${state.scriptLines.length}${qaFilter !== "all" ? ` · ${activeReviewFilterLabel()}` : ""}`
    : "";
  updateEditedPreviewInfo();
  renderProjectInfo();
}

function defaultMediaItem(items) {
  const draftAudio = (items || []).find(item => item.id === "draft" && item.type === "audio");
  return draftAudio || (items || [])[0] || null;
}

function reviewAudioItem() {
  return (meta.media || []).find(item => item.id === "draft" && item.type === "audio") || null;
}

function sourcePreviewItem() {
  const audio = reviewAudioItem();
  if (audio) return audio;
  const items = meta.media || [];
  return items.find(item => item.id === "source-video")
    || items.find(item => item.id === "source")
    || (meta.sourceMedia ? {
      id: "source",
      label: meta.mediaType === "video" ? "原始视频" : "原始音频",
      type: meta.mediaType === "video" ? "video" : "audio",
      url: meta.sourceMedia,
    } : null)
    || defaultMediaItem(items);
}

function editedPreviewItem() {
  const audio = reviewAudioItem();
  if (audio) return audio;
  const items = meta.media || [];
  return items.find(item => item.id === "draft")
    || items.find(item => item.id === "preview-media")
    || items.find(item => item.id === "source")
    || defaultMediaItem(items);
}

function mediaTagHtml(item, attr) {
  if (!item) return `<div class="empty">当前项目没有可预览媒体</div>`;
  const tag = item.type === "video" ? "video" : "audio";
  return `<${tag} ${attr} controls preload="metadata" src="${escapeHtml(item.url)}"></${tag}>`;
}

function renderMediaTabs() {
  const sourceItem = sourcePreviewItem();
  const editedItem = editedPreviewItem();
  $("sourceMediaMount").innerHTML = mediaTagHtml(sourceItem, "data-source-media");
  $("editedMediaMount").innerHTML = mediaTagHtml(editedItem, "data-edited-media");
  attachEditedSkipPreview();
}

function renderExportResults(result = null) {
  if (!result) {
    $("exportResults").textContent = "还没有导出";
    return;
  }
  const entries = [
    ["成片 SRT", result.srt],
    ["原始时间线 SRT", result.currentTimelineSrt],
    ["EDL / keep segments", result.edl],
    ["删除区间 CSV", result.deletes],
    ["全文 CSV", result.scriptLines],
    ["DaVinci FCPXML", result.davinciTimelineFcpxml],
    ["DaVinci handoff", result.davinciHandoff],
    ["DaVinci keep CSV", result.davinciKeepCsv],
    ["DaVinci readme", result.davinciReadme],
    ["成片逐字对齐 JSON", result.selectedAlignmentJson],
    ["成片逐字对齐 JSONL", result.selectedAlignmentUnitsJsonl],
    ["成片逐字对齐 CSV", result.selectedAlignmentUnitsCsv],
    ["原始时间线逐字对齐 JSON", result.originalAlignmentJson],
    ["原始时间线逐字对齐 JSONL", result.originalAlignmentUnitsJsonl],
    ["原始时间线逐字对齐 CSV", result.originalAlignmentUnitsCsv],
    ["渲染媒体", result.media || result.audio || result.video],
  ].filter(([, value]) => value);
  $("exportResults").innerHTML = entries.map(([label, value]) =>
    `<div><strong>${escapeHtml(label)}</strong>：${escapeHtml(value)}</div>`
  ).join("");
}

function visibleLines() {
  const q = $("search").value.trim().toLowerCase();
  return state.scriptLines.filter(line => {
    if (showDeletedOnly && !line.deleted) return false;
    if (!lineMatchesReviewFilter(line)) return false;
    if (!q) return true;
    return reviewItemSearchText(line).includes(q);
  });
}

function lineIdsForTake(take) {
  return Array.isArray(take.lineIds) && take.lineIds.length ? take.lineIds : [take.lineId].filter(Boolean);
}

function linesForTake(take) {
  if (take.takeId) {
    const lines = linesForTakeId(take.takeId);
    if (lines.length) return lines;
  }
  return lineIdsForTake(take).map(id => lineById(id)).filter(Boolean);
}

function takeText(take) {
  const lines = linesForTake(take);
  return lines.length ? lines.map(line => line.text || "").join("") : (take.text || "");
}

function takeDeleted(take) {
  const lines = linesForTake(take);
  return lines.length ? lines.every(line => line.deleted) : Boolean(take.deleted);
}

function visibleCandidateGroups() {
  const q = $("search").value.trim().toLowerCase();
  const groups = state.referenceReview?.groups || [];
  return groups.map(group => ({
    ...group,
    takes: (group.takes || []).filter(take => {
      const lines = linesForTake(take);
      const text = reviewItemSearchText(take, lines, group.referenceText || "");
      if (showDeletedOnly && !takeDeleted(take)) return false;
      if (!reviewItemMatchesFilter(take, qaFilter, lines)) return false;
      return !q || text.includes(q);
    }),
  })).filter(group => group.takes.length);
}

function renderModeControls() {
  const hasReference = Boolean(state.referenceReview?.groups?.length);
  if (!hasReference && reviewMode === "candidates") reviewMode = "lines";
  $("candidateModeBtn").disabled = !hasReference;
  $("candidateModeBtn").classList.toggle("active", reviewMode === "candidates");
  $("lineModeBtn").classList.toggle("active", reviewMode === "lines");
  $("showDeleted").classList.toggle("active", showDeletedOnly);
  renderReviewFilters();
}

function renderRows() {
  const rows = visibleLines();
  const editable = canEdit();
  $("scriptRows").innerHTML = rows.map(line => {
    const deleted = Boolean(line.deleted);
    const active = String(line.id) === String(activeLineId);
    const pause = line.lineType === "pause";
    const flags = reviewFlagsHtml(line);
    const rowClass = ["line-row", deleted ? "deleted" : "", active ? "active" : "", pause ? "pause" : "", reviewClassListForItem(line)].filter(Boolean).join(" ");
    return `<div class="${rowClass}" data-line-id="${line.id}">
      <div class="line-meta">
        <div><span class="line-number">#${line.index}</span></div>
        <div class="time">源 ${fmt(line.start)}-${fmt(line.end)}<br>${deleted ? "成片 删除" : `成片 ${fmt(sourceToOutputTime(line.start))}`}</div>
      </div>
      <div>
        <div class="line-text" data-line-text="${line.id}" contenteditable="${editable ? "true" : "false"}" spellcheck="false">${escapeHtml(line.text)}</div>
        ${flags}
      </div>
      <div class="line-actions">
        <button class="small" data-play-line="${line.id}">播放</button>
        <button class="small danger" data-toggle-delete="${line.id}" ${editable ? "" : "disabled"}>${deleted ? "保留" : "删线"}</button>
        <button class="small" data-insert-after="${line.id}" ${editable ? "" : "disabled"}>插下</button>
      </div>
    </div>`;
  }).join("") || `<div class="empty">没有匹配的行</div>`;
}

function renderCandidateGroups() {
  const editable = canEdit();
  const groups = visibleCandidateGroups();
  $("scriptRows").innerHTML = groups.length ? `<div class="candidate-groups">${
    groups.map(group => {
      const refNumber = Number(group.referenceIndex) + 1;
      const takes = group.takes || [];
      const multiTake = takes.length > 1;
      const groupLabel = multiTake ? `${takes.length} 个候选` : "已匹配";
      return `<section class="candidate-group">
        <div class="candidate-head">
          <div class="candidate-meta">参考句 #${refNumber} · ${groupLabel}</div>
          <div class="reference-text">${escapeHtml(group.referenceText || "")}</div>
        </div>
        ${takes.map(take => {
          const lines = linesForTake(take);
          const firstLine = lines[0] || null;
          const deleted = takeDeleted(take);
          const active = firstLine && String(firstLine.id) === String(activeLineId);
          const flags = reviewFlagsHtml(take, lines);
          const start = firstLine ? Math.min(...lines.map(line => parseNum(line.start))) : parseNum(take.start);
          const end = firstLine ? Math.max(...lines.map(line => parseNum(line.end))) : parseNum(take.end);
          const rowClass = ["take-row", deleted ? "deleted" : "", active ? "active" : "", reviewClassListForItem(take, lines)].filter(Boolean).join(" ");
          return `<div class="${rowClass}" data-take-id="${escapeHtml(take.takeId || "")}" data-line-id="${firstLine?.id || take.lineId || ""}">
            <div class="line-meta">
              <div><span class="line-number">#${escapeHtml(firstLine?.index || take.index || take.lineId || "")}</span></div>
              <div class="time">源 ${fmt(start)}-${fmt(end)}<br>${deleted ? "成片 删除" : `成片 ${fmt(sourceToOutputTime(start))}`}</div>
              <div class="candidate-meta">score ${(Number(take.matchScore) || 0).toFixed(2)}</div>
            </div>
            <div>
              <div class="take-text">${escapeHtml(takeText(take))}</div>
              ${flags}
            </div>
            <div class="line-actions">
              <button class="small" data-play-line="${firstLine?.id || take.lineId || ""}">播放</button>
              ${multiTake ? `<button class="small primary" data-keep-take="${escapeHtml(take.takeId || "")}" ${editable && deleted ? "" : "disabled"}>保留此条</button>` : ""}
              <button class="small danger" data-toggle-take-delete="${escapeHtml(take.takeId || "")}" ${editable ? "" : "disabled"}>${deleted ? "保留" : "删线"}</button>
            </div>
          </div>`;
        }).join("")}
      </section>`;
    }).join("")
  }</div>` : `<div class="empty">没有匹配的文案候选；可切回全文行继续审阅</div>`;
}

function renderAll() {
  renderMetrics();
  renderModeControls();
  if (reviewMode === "candidates") renderCandidateGroups();
  else renderRows();
}

function lineById(id) {
  return state.scriptLines.find(line => String(line.id) === String(id));
}

function lineIndexById(id) {
  return state.scriptLines.findIndex(line => String(line.id) === String(id));
}

function nextLineId() {
  return Math.max(0, ...state.scriptLines.map(line => Number(line.id) || 0)) + 1;
}

function renumberLines() {
  state.scriptLines.sort((a, b) => parseNum(a.start) - parseNum(b.start) || parseNum(a.end) - parseNum(b.end));
  state.scriptLines.forEach((line, i) => line.index = i + 1);
}

function caretOffset(el) {
  const selection = window.getSelection();
  if (!selection || selection.rangeCount === 0) return String(el.innerText || "").length;
  const range = selection.getRangeAt(0);
  const before = range.cloneRange();
  before.selectNodeContents(el);
  before.setEnd(range.endContainer, range.endOffset);
  return before.toString().length;
}

function updateActiveRowClass() {
  document.querySelectorAll("[data-line-id]").forEach(row => {
    row.classList.toggle("active", String(row.dataset.lineId) === String(activeLineId));
  });
}

function updateLineRowState(line) {
  const row = document.querySelector(`[data-line-id="${CSS.escape(String(line.id))}"]`);
  if (!row) return false;
  row.classList.toggle("deleted", Boolean(line.deleted));
  row.classList.toggle("active", String(line.id) === String(activeLineId));
  applyReviewRowClasses(row, line);
  return true;
}

function scrollActiveIntoView() {
  const row = document.querySelector(`[data-line-id="${CSS.escape(String(activeLineId))}"]`);
  if (row) row.scrollIntoView({ block: "center", behavior: "smooth" });
}

function placeCaretAtEnd(el) {
  const range = document.createRange();
  range.selectNodeContents(el);
  range.collapse(false);
  const selection = window.getSelection();
  selection.removeAllRanges();
  selection.addRange(range);
}

function focusLineText(id) {
  const el = document.querySelector(`[data-line-text="${CSS.escape(String(id))}"]`);
  if (!el) return false;
  el.focus();
  placeCaretAtEnd(el);
  return true;
}

function setActive(id, rerender = true) {
  activeLineId = Number(id);
  if (rerender) {
    renderAll();
  } else {
    updateActiveRowClass();
    renderMetrics();
  }
}

function syncTextFromElement(el) {
  if (!canEdit()) return;
  const line = lineById(el.dataset.lineText);
  if (!line) return;
  line.text = String(el.textContent ?? el.innerText ?? "")
    .replace(/\u00a0/g, " ")
    .replace(/[\r\n\t]+/g, " ");
  setActive(line.id, false);
  setDirty();
  renderMetrics();
}

function lineTextValue(line) {
  return cleanReviewText(line?.text || "");
}

function partTime(line, offset, textLength) {
  const start = parseNum(line.start);
  const end = Math.max(start + 0.05, parseNum(line.end));
  const length = Math.max(1, textLength);
  return start + (end - start) * Math.max(0, Math.min(length, offset)) / length;
}

function setLineDeleted(line, reason = "manual-delete") {
  line.deleted = true;
  if (!lineTextValue(line)) line.text = "手动删除";
  if (!String(line.source || "").includes(reason)) {
    line.source = `${line.source || ""} ${reason}`.trim();
  }
}

function isSuggestedDeleteLine(line) {
  const source = String(line.source || "");
  return source.startsWith("delete#")
    || source.includes("suggested-delete")
    || source.includes("delete-csv")
    || source.includes("semantic-llm:delete")
    || source.includes("targeted-fix:delete")
    || line.lineType === "pause";
}

function splitLine(id, pos = null) {
  if (!requireEdit()) return;
  const line = lineById(id);
  if (!line) return;
  pushUndoSnapshot("split-line");
  const text = lineTextValue(line);
  const cut = Math.max(0, Math.min(text.length, pos ?? Math.ceil(text.length / 2)));
  const left = text.slice(0, cut).trim();
  const right = text.slice(cut).trim();
  const start = parseNum(line.start);
  const end = Math.max(start + 0.05, parseNum(line.end));
  const ratio = text.length ? cut / text.length : 1;
  const mid = Math.max(start + 0.05, Math.min(end, start + (end - start) * ratio));
  line.text = left;
  line.end = mid;
  const newLine = {
    ...line,
    id: nextLineId(),
    index: line.index + 1,
    start: mid,
    end: Math.max(mid + 0.05, end),
    text: right,
    deleted: Boolean(line.deleted),
    source: line.source || "",
  };
  const idx = lineIndexById(id);
  state.scriptLines.splice(idx + 1, 0, newLine);
  renumberLines();
  setDirty();
  setActive(newLine.id);
}

function mergeWithPrevious(id) {
  if (!requireEdit()) return;
  const idx = lineIndexById(id);
  if (idx <= 0) return;
  pushUndoSnapshot("merge-previous");
  const prev = state.scriptLines[idx - 1];
  const line = state.scriptLines[idx];
  prev.text = `${prev.text}${line.text ? " " + line.text : ""}`.trim();
  prev.end = Math.max(parseNum(prev.end), parseNum(line.end));
  prev.deleted = Boolean(prev.deleted || line.deleted);
  state.scriptLines.splice(idx, 1);
  renumberLines();
  setDirty();
  setActive(prev.id);
}

function mergeNext(id) {
  if (!requireEdit()) return;
  const idx = lineIndexById(id);
  if (idx < 0 || idx >= state.scriptLines.length - 1) return;
  pushUndoSnapshot("merge-next");
  const line = state.scriptLines[idx];
  const next = state.scriptLines[idx + 1];
  line.text = `${line.text}${next.text ? " " + next.text : ""}`.trim();
  line.end = Math.max(parseNum(line.end), parseNum(next.end));
  line.deleted = Boolean(line.deleted || next.deleted);
  state.scriptLines.splice(idx + 1, 1);
  renumberLines();
  setDirty();
  setActive(line.id);
}

function insertAfter(id) {
  if (!requireEdit()) return;
  const idx = lineIndexById(id);
  if (idx < 0) return;
  pushUndoSnapshot("insert-line");
  const line = state.scriptLines[idx];
  const t = parseNum(line.end);
  const newLine = {
    id: nextLineId(),
    index: line.index + 1,
    start: t,
    end: t + 0.05,
    text: "",
    deleted: false,
    source: "manual",
  };
  state.scriptLines.splice(idx + 1, 0, newLine);
  renumberLines();
  setDirty();
  setActive(newLine.id);
}

function toggleDelete(id) {
  if (!requireEdit()) return;
  const line = lineById(id);
  if (!line) return;
  pushUndoSnapshot("toggle-delete");
  line.deleted = !line.deleted;
  if (line.deleted && !lineTextValue(line)) setLineDeleted(line);
  activeLineId = Number(line.id);
  setDirty();
  if (showDeletedOnly) {
    renderAll();
  } else if (!updateLineRowState(line)) {
    renderAll();
  }
  updateActiveRowClass();
  renderMetrics();
}

function removeLine(id, confirmDelete = true) {
  if (!requireEdit()) return;
  const idx = lineIndexById(id);
  if (idx < 0) return;
  const line = state.scriptLines[idx];
  if (confirmDelete && !confirm(`确定把第 ${line.index} 行标记为删除线？导出的 XML 会剪掉这一段。`)) return;
  pushUndoSnapshot("remove-line");
  setLineDeleted(line);
  activeLineId = line.id;
  setDirty();
  renderAll();
}

function selectionOffsetsInElement(el) {
  const selection = window.getSelection();
  if (!selection || selection.rangeCount === 0 || selection.isCollapsed) return null;
  const range = selection.getRangeAt(0);
  if (!el.contains(range.startContainer) || !el.contains(range.endContainer)) return null;
  const startRange = range.cloneRange();
  startRange.selectNodeContents(el);
  startRange.setEnd(range.startContainer, range.startOffset);
  const endRange = range.cloneRange();
  endRange.selectNodeContents(el);
  endRange.setEnd(range.endContainer, range.endOffset);
  const start = startRange.toString().length;
  const end = endRange.toString().length;
  return {
    start: Math.max(0, Math.min(start, end)),
    end: Math.max(start, end),
  };
}

function splitSelectionAsDeleted(textEl) {
  if (!requireEdit()) return false;
  const line = lineById(textEl.dataset.lineText);
  if (!line) return false;
  const offsets = selectionOffsetsInElement(textEl);
  const text = lineTextValue(line);
  if (!offsets || offsets.end <= offsets.start || !text) return false;
  const startOffset = Math.max(0, Math.min(text.length, offsets.start));
  const endOffset = Math.max(startOffset, Math.min(text.length, offsets.end));
  if (endOffset <= startOffset) return false;

  const idx = lineIndexById(line.id);
  pushUndoSnapshot("selection-delete");
  let nextIdValue = nextLineId();
  const originalEnd = Math.max(partTime(line, 0, text.length) + 0.01, parseNum(line.end));
  const parts = [
    { text: text.slice(0, startOffset), startOffset: 0, endOffset: startOffset, deleted: false, source: line.source || "" },
    { text: text.slice(startOffset, endOffset), startOffset, endOffset, deleted: true, source: `${line.source || ""} manual-selection-delete`.trim() },
    { text: text.slice(endOffset), startOffset: endOffset, endOffset: text.length, deleted: false, source: line.source || "" },
  ];
  const replacement = [];
  for (const part of parts) {
    const partText = cleanReviewText(part.text);
    if (!part.deleted && !partText) continue;
    const partStart = partTime(line, part.startOffset, text.length);
    const partEnd = Math.min(originalEnd, Math.max(partStart, partTime(line, part.endOffset, text.length)));
    if (partEnd <= partStart + 0.001) continue;
    replacement.push({
      ...line,
      id: replacement.length === 0 ? line.id : nextIdValue++,
      index: line.index + replacement.length,
      start: Number(partStart.toFixed(3)),
      end: Number(partEnd.toFixed(3)),
      text: partText || "手动删除",
      deleted: part.deleted,
      source: part.source,
    });
  }
  if (!replacement.length) return false;
  state.scriptLines.splice(idx, 1, ...replacement);
  renumberLines();
  setDirty();
  setActive(replacement.find(item => item.deleted)?.id || replacement[0].id);
  scrollActiveIntoView();
  return true;
}

function moveActive(delta, focusText = false) {
  const rows = visibleLines();
  if (!rows.length) return;
  const current = rows.findIndex(line => String(line.id) === String(activeLineId));
  const next = current < 0
    ? (delta > 0 ? 0 : rows.length - 1)
    : Math.max(0, Math.min(rows.length - 1, current + delta));
  setActive(rows[next].id);
  scrollActiveIntoView();
  if (focusText) requestAnimationFrame(() => focusLineText(rows[next].id));
}

function jumpDeleted(delta) {
  const deleted = state.scriptLines.filter(line => line.deleted);
  if (!deleted.length) {
    setStatus("当前没有删除线", "danger-text");
    return;
  }
  const active = lineById(activeLineId);
  const activeIndex = active ? active.index : (delta > 0 ? 0 : Number.MAX_SAFE_INTEGER);
  let next = delta > 0
    ? deleted.find(line => line.index > activeIndex) || deleted[0]
    : [...deleted].reverse().find(line => line.index < activeIndex) || deleted[deleted.length - 1];
  setActive(next.id);
  scrollActiveIntoView();
}

function linesForTakeId(takeId) {
  return state.scriptLines.filter(line => String(line.takeId || "") === String(takeId));
}

function referenceIndexForTake(takeId) {
  const line = linesForTakeId(takeId)[0];
  return line?.referenceIndex;
}

function keepTake(takeId) {
  if (!requireEdit()) return;
  const refIndex = referenceIndexForTake(takeId);
  if (refIndex === undefined || refIndex === null) return;
  pushUndoSnapshot("keep-take");
  state.scriptLines.forEach(line => {
    if (line.referenceIndex !== refIndex || line.lineType === "pause") return;
    const keep = String(line.takeId || "") === String(takeId);
    line.deleted = !keep;
    line.takeRole = keep ? "primary" : "alternate";
  });
  setDirty();
  setStatus("已保留该候选 take", "ok");
  renderAll();
}

function toggleTakeDelete(takeId) {
  if (!requireEdit()) return;
  const lines = linesForTakeId(takeId);
  if (!lines.length) return;
  pushUndoSnapshot("toggle-take-delete");
  const shouldDelete = !lines.every(line => line.deleted);
  lines.forEach(line => {
    line.deleted = shouldDelete;
    line.takeRole = shouldDelete && line.takeRole === "primary" ? "alternate" : line.takeRole;
  });
  activeLineId = lines[0].id;
  setDirty();
  setStatus(shouldDelete ? "已标记该候选 take 为删除" : "已恢复该候选 take", "ok");
  renderAll();
}

function deletedIntervals() {
  const intervals = state.scriptLines
    .filter(line => line.deleted)
    .map(line => ({
      start: parseNum(line.start),
      end: Math.max(parseNum(line.start), parseNum(line.end)),
    }))
    .filter(item => item.end > item.start + 0.02)
    .sort((a, b) => a.start - b.start || a.end - b.end);
  const merged = [];
  for (const item of intervals) {
    const last = merged[merged.length - 1];
    if (last && item.start <= last.end + 0.02) {
      last.end = Math.max(last.end, item.end);
    } else {
      merged.push({ ...item });
    }
  }
  return merged;
}

function nextKeptTime(value) {
  let time = Math.max(0, Number(value) || 0);
  for (const item of deletedIntervals()) {
    if (time >= item.start - 0.01 && time < item.end - 0.01) {
      time = item.end + 0.01;
    }
  }
  return time;
}

function sourceToOutputTime(value) {
  let removed = 0;
  const time = Math.max(0, Number(value) || 0);
  for (const item of deletedIntervals()) {
    if (time >= item.end) {
      removed += item.end - item.start;
    } else if (time > item.start) {
      removed += time - item.start;
      break;
    } else {
      break;
    }
  }
  return Math.max(0, time - removed);
}

function applyEditedSkip(media) {
  if (!media) return;
  const current = Number(media.currentTime) || 0;
  for (const item of deletedIntervals()) {
    if (current >= item.start && current < item.end - 0.02) {
      media.currentTime = item.end + 0.01;
      return;
    }
  }
}

function attachEditedSkipPreview() {
  const media = document.querySelector("[data-edited-media]");
  if (!media) return;
  if (editedSkipHandler) media.removeEventListener("timeupdate", editedSkipHandler);
  editedSkipHandler = () => applyEditedSkip(media);
  media.addEventListener("timeupdate", editedSkipHandler);
  updateEditedPreviewInfo();
}

function updateEditedPreviewInfo() {
  if (!$("editedPreviewInfo")) return;
  const deleted = deletedIntervals().reduce((sum, item) => sum + item.end - item.start, 0);
  $("editedPreviewInfo").textContent = deleted > 0
    ? `实时跳过 ${fmt(deleted)} 删除线；播放器时间仍显示原始素材时间`
    : "当前没有删除线，右侧预览等同原始素材";
}

function clearPlaybackStop() {
  if (stopMedia && stopHandler) stopMedia.removeEventListener("timeupdate", stopHandler);
  if (stopPollTimer) clearInterval(stopPollTimer);
  stopHandler = null;
  stopMedia = null;
  stopPollTimer = null;
}

function stopPlayback(media) {
  media.pause();
  clearPlaybackStop();
}

function playRange(start, end, target = "source") {
  const media = document.querySelector(target === "source" ? "[data-source-media]" : "[data-edited-media]");
  if (!media) return;
  clearPlaybackStop();
  const startAt = Number(start) || 0;
  const endAt = Math.max(startAt + 0.05, Number(end) || startAt + 0.05);
  const preRoll = target === "source" ? 0.06 : 0.15;
  const postRoll = target === "source" ? 0.03 : 0.12;
  const stopAt = endAt + postRoll;
  stopHandler = () => {
    if (target === "edited") applyEditedSkip(media);
    if (media.currentTime >= stopAt) {
      stopPlayback(media);
    }
  };
  media.currentTime = target === "edited"
    ? Math.max(0, nextKeptTime(startAt) - preRoll)
    : Math.max(0, startAt - preRoll);
  stopMedia = media;
  media.addEventListener("timeupdate", stopHandler);
  stopPollTimer = setInterval(stopHandler, 30);
  const playResult = media.play();
  if (playResult?.catch) {
    playResult.catch(() => clearPlaybackStop());
  }
}

function handleConflict(data) {
  saveConflict = data;
  setStatus(`保存冲突：磁盘版本已经更新（当前版本 ${shortRevision(data.currentRevision)}）。请重载或强制覆盖。`, "danger-text");
  renderAll();
}

async function saveState(force = false) {
  if (busyMode) return;
  if (!requireEdit()) return;
  state.useScriptLines = true;
  state.updatedAt = new Date().toISOString();
  setBusy("saving");
  setStatus(force ? "正在强制覆盖保存" : "正在保存");
  try {
    const res = await fetch(apiPath("/api/save"), {
      method: "POST",
      body: JSON.stringify({ state, baseRevision, force, lockToken }),
    });
    const data = await res.json();
    if (res.status === 423 || data.locked) {
      applyLockStatus({ locked: true, heldByMe: false, lock: data.lock });
      setStatus(`保存失败：${data.lock?.ownerName || "其他浏览器"} 正在编辑。`, "danger-text");
      return;
    }
    if (res.status === 409 || data.conflict) {
      handleConflict(data);
      return;
    }
    if (data.ok) {
      baseRevision = data.revision || baseRevision;
      dirty = false;
      saveConflict = null;
    }
    renderAll();
    setStatus(data.ok ? `已保存：${data.path}` : `保存失败：${data.error}`, data.ok ? "ok" : "danger-text");
  } catch (err) {
    setStatus(`保存失败：${err.message}`, "danger-text");
  } finally {
    setBusy("");
  }
}

async function exportState(render = false) {
  if (busyMode) return;
  if (!requireEdit()) return;
  state.useScriptLines = true;
  state.updatedAt = new Date().toISOString();
  setBusy(render ? "rendering" : "exporting");
  setStatus(render ? "正在按删除线渲染预览，可能需要一段时间" : "正在导出");
  try {
    const res = await fetch(apiPath(render ? "/api/render" : "/api/export"), {
      method: "POST",
      body: JSON.stringify({ state, baseRevision, lockToken }),
    });
    const data = await res.json();
    if (res.status === 423 || data.locked) {
      applyLockStatus({ locked: true, heldByMe: false, lock: data.lock });
      setStatus(`${render ? "渲染" : "导出"}失败：${data.lock?.ownerName || "其他浏览器"} 正在编辑。`, "danger-text");
      return;
    }
    if (res.status === 409 || data.conflict) {
      handleConflict(data);
      return;
    }
    if (!data.ok) {
      setStatus(`导出失败：${data.error}`, "danger-text");
      return;
    }
    const r = data.result;
    baseRevision = data.revision || baseRevision;
    dirty = false;
    saveConflict = null;
    renderExportResults(r);
    renderAll();
    setStatus(render ? "已导出并渲染预览" : "已导出文件", "ok");
  } catch (err) {
    setStatus(`${render ? "渲染" : "导出"}失败：${err.message}`, "danger-text");
  } finally {
    setBusy("");
  }
}

document.addEventListener("input", (e) => {
  const target = e.target;
  if (target.id === "search") {
    renderAll();
    return;
  }
  if (target.dataset?.lineText) syncTextFromElement(target);
});

document.addEventListener("beforeinput", (e) => {
  const textEl = e.target.closest?.("[data-line-text]");
  if (!textEl || !canEdit()) return;
  beginTextHistory();
});

document.addEventListener("keydown", (e) => {
  const textEl = e.target.closest?.("[data-line-text]");
  const isEditable = Boolean(textEl) || ["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z") {
    if (e.target.id === "search") return;
    e.preventDefault();
    if (textEl) syncTextFromElement(textEl);
    if (e.shiftKey) redoEdit();
    else undoEdit();
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "y") {
    if (e.target.id === "search") return;
    e.preventDefault();
    if (textEl) syncTextFromElement(textEl);
    redoEdit();
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") {
    e.preventDefault();
    saveState(false);
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "p") {
    e.preventDefault();
    if (textEl) syncTextFromElement(textEl);
    const line = lineById(textEl?.dataset.lineText || activeLineId);
    if (line) playRange(line.start, line.end, "source");
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "d") {
    e.preventDefault();
    if (textEl && splitSelectionAsDeleted(textEl)) return;
    if (activeLineId) toggleDelete(activeLineId);
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "j") {
    e.preventDefault();
    if (activeLineId) mergeNext(activeLineId);
    return;
  }
  if (!isEditable && e.key === "/") {
    e.preventDefault();
    $("search").focus();
    return;
  }
  if (!isEditable && e.key.toLowerCase() === "j") {
    e.preventDefault();
    moveActive(1);
    return;
  }
  if (!isEditable && e.key.toLowerCase() === "k") {
    e.preventDefault();
    moveActive(-1);
    return;
  }
  if (!e.metaKey && !e.ctrlKey && !e.altKey && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    if (textEl || !isEditable) {
      e.preventDefault();
      if (textEl) syncTextFromElement(textEl);
      moveActive(e.key === "ArrowDown" ? 1 : -1, true);
      return;
    }
  }
  if (e.key === "Escape") {
    if ($("search").value) {
      $("search").value = "";
      renderAll();
    }
    if (document.activeElement?.blur) document.activeElement.blur();
    return;
  }
  if (!textEl) return;
  const id = textEl.dataset.lineText;
  if (e.key === "Tab") {
    e.preventDefault();
    syncTextFromElement(textEl);
    moveActive(e.shiftKey ? -1 : 1, true);
    return;
  }
  if ((e.key === "Backspace" || e.key === "Delete") && !String(lineById(id)?.text || "").trim()) {
    e.preventDefault();
    removeLine(id, false);
    return;
  }
  if (e.key === "Enter") {
    e.preventDefault();
    syncTextFromElement(textEl);
    splitLine(id, caretOffset(textEl));
    return;
  }
  if (e.key === "Backspace" && caretOffset(textEl) === 0) {
    e.preventDefault();
    syncTextFromElement(textEl);
    mergeWithPrevious(id);
  }
});

document.addEventListener("paste", (e) => {
  const textEl = e.target.closest?.("[data-line-text]");
  if (!textEl) return;
  if (!canEdit()) return;
  e.preventDefault();
  beginTextHistory();
  document.execCommand("insertText", false, e.clipboardData.getData("text/plain"));
});

document.addEventListener("click", (e) => {
  const row = e.target.closest?.("[data-line-id]");
  if (row) setActive(row.dataset.lineId, false);
  const button = e.target.closest?.("button");
  if (!button) return;
  if (button.dataset.reviewFilter) {
    qaFilter = button.dataset.reviewFilter;
    renderAll();
    return;
  }
  if (button.dataset.playLine) {
    const line = lineById(button.dataset.playLine);
    if (line) playRange(line.start, line.end, "source");
  }
  if (button.dataset.toggleDelete) toggleDelete(button.dataset.toggleDelete);
  if (button.dataset.insertAfter) insertAfter(button.dataset.insertAfter);
  if (button.dataset.keepTake) keepTake(button.dataset.keepTake);
  if (button.dataset.toggleTakeDelete) toggleTakeDelete(button.dataset.toggleTakeDelete);
});

window.addEventListener("beforeunload", (e) => {
  if (!dirty) return;
  e.preventDefault();
  e.returnValue = "";
});

window.addEventListener("pagehide", () => {
  if (!lockToken || !currentProjectId) return;
  stopHeartbeat();
  const body = JSON.stringify(lockPayload());
  if (navigator.sendBeacon) {
    navigator.sendBeacon(`/api/lock/release?project=${encodeURIComponent(currentProjectId)}`, body);
  }
});

$("saveBtn").addEventListener("click", () => saveState(false));
$("forceSaveBtn").addEventListener("click", () => {
  if (!confirm("强制覆盖会用当前页面内容覆盖磁盘上的新版本。继续？")) return;
  saveState(true);
});
$("exportBtn").addEventListener("click", () => exportState(false));
$("renderBtn").addEventListener("click", () => exportState(true));
$("acquireLockBtn").addEventListener("click", () => acquireLock(false));
$("takeoverLockBtn").addEventListener("click", () => {
  const owner = lockStatus?.lock?.ownerName || "其他浏览器";
  if (!confirm(`确定接管 ${owner} 的编辑权？对方页面会变成只读。`)) return;
  acquireLock(true);
});
$("releaseLockBtn").addEventListener("click", () => releaseLock());
$("reloadBtn").addEventListener("click", () => {
  if (!confirm("从本地状态重新载入，未保存的页面改动会丢失。继续？")) return;
  loadData(currentProjectId, { force: true });
});
$("projectSelect").addEventListener("change", (e) => loadData(e.target.value));
$("candidateModeBtn").addEventListener("click", () => {
  reviewMode = "candidates";
  renderAll();
});
$("lineModeBtn").addEventListener("click", () => {
  reviewMode = "lines";
  renderAll();
});
$("showDeleted").addEventListener("click", () => {
  showDeletedOnly = !showDeletedOnly;
  $("showDeleted").classList.toggle("active", showDeletedOnly);
  renderAll();
});
$("prevDeleted").addEventListener("click", () => jumpDeleted(-1));
$("nextDeleted").addEventListener("click", () => jumpDeleted(1));
$("restoreSuggested").addEventListener("click", () => {
  if (!requireEdit()) return;
  const count = state.scriptLines.filter(line => isSuggestedDeleteLine(line)).length;
  if (!confirm(`恢复建议删除线会重置当前所有删除线，并按来源重新标记 ${count} 行。继续？`)) return;
  pushUndoSnapshot("restore-suggested");
  state.scriptLines.forEach(line => line.deleted = isSuggestedDeleteLine(line));
  setDirty();
  renderAll();
});
$("clearDeleted").addEventListener("click", () => {
  if (!requireEdit()) return;
  const count = state.scriptLines.filter(line => line.deleted).length;
  if (!confirm(`确定取消全部 ${count} 条删除线？这会暂时保留所有内容，需要保存后才写入磁盘。`)) return;
  pushUndoSnapshot("clear-deleted");
  state.scriptLines.forEach(line => line.deleted = false);
  setDirty();
  renderAll();
});

if (location.protocol === "file:") {
  setStatus("当前是 file:// 静态页，请打开 http://127.0.0.1:8765；静态页不能可靠保存、导出或读取最新稿。", "danger-text");
} else {
  loadProjects().catch(err => {
    console.error(err);
    setStatus(`载入失败：${err.message}`, "danger-text");
  });
}
</script>
